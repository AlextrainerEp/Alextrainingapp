<style>
:root{color-scheme:dark;--bg:#0b0b0b;--surface:#161616;--line:#2c2c2c;--text:#f4f2ec;--muted:#aeaba3;--accent:#f5b400;
--display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.65}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{border-bottom:1px solid var(--line);background:rgba(11,11,11,.95);position:sticky;top:0;z-index:5}
.top{max-width:820px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.top img{height:52px;width:auto;display:block}
.top a.volver{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-weight:600;text-decoration:none;color:var(--muted);white-space:nowrap}
.top a.volver:hover{color:var(--accent)}
main{max-width:820px;margin:0 auto;padding:48px 24px 72px}
.kicker{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.22em;font-size:.95rem;color:var(--accent);margin:0}
h1{font-family:var(--display);text-transform:uppercase;font-size:clamp(2.3rem,6vw,3.4rem);line-height:1.02;margin:10px 0 8px}
.fecha{color:var(--muted);margin:0 0 36px;font-size:.95rem}
h2{font-family:var(--display);text-transform:uppercase;font-size:1.6rem;line-height:1.1;margin:40px 0 12px;padding-top:20px;border-top:1px solid var(--line)}
h3{font-family:var(--display);text-transform:uppercase;font-size:1.2rem;margin:24px 0 8px;color:var(--accent)}
p,li{color:#dcd9d1}
ul,ol{padding-left:22px}
li{margin:6px 0}
ul.datos{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
ul.datos li{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:12px 0;margin:0;border-bottom:1px solid var(--line)}
ul.datos span{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
@media (max-width:520px){ul.datos li{grid-template-columns:1fr;gap:2px}}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.95rem}
th,td{text-align:left;vertical-align:top;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tabla{overflow-x:auto}
.caja{background:var(--surface);border-left:4px solid var(--accent);padding:16px 20px;margin:16px 0}
mark{background:var(--accent);color:#0b0b0b;padding:0 4px;border-radius:2px;font-weight:600}
footer{border-top:1px solid var(--line);padding:26px 24px;color:var(--muted);font-size:.92rem}
footer .in{max-width:820px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 20px}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--accent)}
</style>
</head>
<body>
