function guardarSesion(){try{if(S&&S.access)localStorage.setItem("alex_s",JSON.stringify({access:S.access,refresh:S.refresh}));else localStorage.removeItem("alex_s")}catch(e){}}
function leerSesion(){try{return JSON.parse(localStorage.getItem("alex_s")||"null")}catch(e){return null}}
function msg(sel,texto,ok){const el=$(sel);if(!el)return;el.textContent=texto;el.className="msg "+(ok?"ok":"err")}
function traducir(m){
  const t={"Invalid login credentials":"Email o contraseña incorrectos","User already registered":"Ya existe una cuenta con ese email","Email not confirmed":"Confirma tu email antes de entrar (revisa tu correo)","Password should be at least 6 characters.":"La contraseña debe tener al menos 6 caracteres","Unable to validate email address: invalid format":"El email no es válido","Email rate limit exceeded":"Demasiados intentos. Espera unos minutos."};
  return t[m]||m;
}

/* ---------- Auth y base de datos ---------- */
async function auth(path,body,method="POST",token){
  const r=await fetch(SB_URL+"/auth/v1/"+path,{method,headers:{apikey:SB_KEY,"Content-Type":"application/json",Authorization:"Bearer "+(token||SB_KEY)},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(traducir(j.msg||j.error_description||j.message||("Error "+r.status)));
  return j;
}
async function refrescar(){
  const j=await auth("token?grant_type=refresh_token",{refresh_token:S.refresh});
  S.access=j.access_token;S.refresh=j.refresh_token;guardarSesion();
}
async function db(method,tabla,query="",body,prefer,reintento){
  const h={apikey:SB_KEY,Authorization:"Bearer "+(S&&S.access?S.access:SB_KEY),"Content-Type":"application/json"};
  if(prefer)h.Prefer=prefer;
  const r=await fetch(`${SB_URL}/rest/v1/${tabla}${query}`,{method,headers:h,body:body!==undefined&&body!==null?JSON.stringify(body):undefined});
  if(r.status===401&&S&&S.refresh&&!reintento){await refrescar();return db(method,tabla,query,body,prefer,true)}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok) throw new Error((j&&(j.message||j.hint))||("Error "+r.status));
  return j;
}
async function cargarPerfil(){
  const u=await auth("user",null,"GET",S.access);
  S.user=u;
  const r=await db("GET","perfiles",`?id=eq.${u.id}&select=*`);
  if(!r||!r.length) throw new Error("Tu cuenta no tiene perfil. Contacta con el entrenador.");
  S.perfil=r[0];
}
async function login(email,pw){
  const j=await auth("token?grant_type=password",{email,password:pw});
  S={access:j.access_token,refresh:j.refresh_token};
  await cargarPerfil();guardarSesion();entrar();
}
async function salir(){S=null;guardarSesion();pantallaLogin()}

    <h3>Crear cuenta</h3>
    <input id="rn" placeholder="Nombre">
    <input id="re" type="email" placeholder="Email">
    <input id="rp" type="password" placeholder="Contraseña (mín. 6 caracteres)">

    <div class="msg" id="m"></div></div>`;
  $("#volver").onclick=e=>{e.preventDefault();pantallaLogin()};
  $("#rg").onclick=async()=>{
    try{
      const nombre=$("#rn").value.trim();
      const j=await auth("signup",{email:$("#re").value.trim(),password:$("#rp").value,data:{nombre}});
      if(j.access_token){S={access:j.access_token,refresh:j.refresh_token};await cargarPerfil();guardarSesion();panelCliente("anamnesis");}
      else msg("#m","Cuenta creada. Revisa tu correo para confirmarla y luego entra.",true);
    }catch(e){msg("#m",e.message,false)}
  };
}

    <h3>Recuperar contraseña</h3>
    <input id="re" type="email" placeholder="Tu email">
    <button class="gold" id="rr" style="width:100%">Enviar enlace</button>
    <p style="text-align:center"><a href="#" id="volver">Volver</a></p>
    <div class="msg" id="m"></div></div>`;
  $("#volver").onclick=e=>{e.preventDefault();pantallaLogin()};
  $("#rr").onclick=async()=>{
    try{
      const destino=location.origin+location.pathname;
      await auth("recover?redirect_to="+encodeURIComponent(destino),{email:$("#re").value.trim()});
      msg("#m","Si el email existe, te hemos enviado un enlace para cambiar la contraseña.",true);
    }catch(e){msg("#m",e.message,false)}
  };
}

/* ---------- Excel ---------- */
async function leerExcel(file){
  if(typeof XLSX==="undefined") throw new Error("No se ha cargado la librería de Excel. Revisa la conexión.");
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
  const lote=[];
  for(const hoja of wb.SheetNames){
    const filas=XLSX.utils.sheet_to_json(wb.Sheets[hoja],{header:1,raw:false,defval:""});
    const hi=filas.findIndex(r=>r.some(c=>norm(c)==="ejercicio"));
    if(hi<0){
      // Hoja sin columna Ejercicio: cada fila con texto es un ejercicio
      const ejs=filas.map(r=>r.filter(c=>String(c).trim()!=="").map(c=>String(c).trim()).join(" · ")).filter(Boolean);
      if(ejs.length) lote.push({fecha:hoja,titulo:hoja,bloques:[{nombre:"General",ejercicios:ejs.map(ej=>({ej}))}]});
      continue;
    }
    const H=filas[hi].map(norm);
    const c=n=>H.findIndex(h=>h.startsWith(n));
    const iF=c("fecha"),iB=c("bloque"),iE=c("ejercicio"),iS=c("series"),iR=c("reps"),iI=c("intensidad"),iP=c("rpe"),iD=c("descanso"),iN=c("notas");
    const get=(r,i)=>i>=0?String(r[i]??"").trim():"";
    const porFecha=new Map();
    for(const r of filas.slice(hi+1)){
      const ej=get(r,iE);
      if(!ej) continue;
      const fecha=get(r,iF)||hoja;
      if(!porFecha.has(fecha)) porFecha.set(fecha,new Map());
      const bl=porFecha.get(fecha);
      const bn=get(r,iB)||"General";
      if(!bl.has(bn)) bl.set(bn,[]);
      bl.get(bn).push({ej,ser:get(r,iS),rep:get(r,iR),int:get(r,iI),rpe:get(r,iP),des:get(r,iD),notas:get(r,iN)});
    }
    for(const [fecha,bl] of porFecha){
      lote.push({fecha,titulo:fecha===hoja?hoja:`${hoja} · ${fecha}`,bloques:[...bl].map(([nombre,ejercicios])=>({nombre,ejercicios}))});
    }
  }
  return lote;
}

/* ---------- Vista de sesión y estadísticas ---------- */
function sesionHTML(s,editable){
  const R=s.registro||{};
  const dis=editable?"":"disabled";
  return (s.bloques||[]).map((b,bi)=>`<div class="bloque"><b>${esc(b.nombre)}</b>
    <div class="ses"><table><tr><th>Ejercicio</th><th>Series</th><th>Reps</th><th>Intensidad</th><th>RPE obj.</th><th>Reps hechas</th><th>RPE</th><th>RIR</th><th>Comentario</th></tr>
    ${(b.ejercicios||[]).map((e,ei)=>{const k=bi+"-"+ei,r=R[k]||{};return `<tr><td>${esc(e.ej)}</td><td>${esc(e.ser)}</td><td>${esc(e.rep)}</td><td>${esc(e.int)}</td><td>${esc(e.rpe)}</td>
      <td><input class="n" data-k="${k}" data-f="reps" value="${esc(r.reps)}" ${dis}></td>
      <td><input class="n" data-k="${k}" data-f="rpe" value="${esc(r.rpe)}" ${dis}></td>
      <td><input class="n" data-k="${k}" data-f="rir" value="${esc(r.rir)}" ${dis}></td>
      <td><input data-k="${k}" data-f="com" value="${esc(r.com)}" ${dis}></td></tr>`}).join("")}
    </table></div>
    <div class="muted">Comentario del bloque</div>
    <textarea data-k="b${bi}" data-f="com" ${dis}>${esc((R["b"+bi]||{}).com)}</textarea></div>`).join("");
}
function leerRegistro(raiz){
  const reg={};
  raiz.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;reg[k]=reg[k]||{};reg[k][el.dataset.f]=el.value});
  return reg;
}
function estadisticas(sesiones){
  const rpe=[],rir=[];let reps=0;
  sesiones.forEach(s=>Object.entries(s.registro||{}).forEach(([k,v])=>{
    if(!/^\d+-\d+$/.test(k)) return;
    const p=parseFloat(String(v.rpe).replace(",","."));if(!isNaN(p))rpe.push(p);
    const q=parseFloat(String(v.rir).replace(",","."));if(!isNaN(q))rir.push(q);
    const n=parseInt(v.reps,10);if(!isNaN(n))reps+=n;
  }));
  const media=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):"–";
  return {sesiones:sesiones.length,rpe:media(rpe),rir:media(rir),reps};
}
function fotoAJPG(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas");c.width=c.height=240;
      const s=Math.min(img.width,img.height),x=(img.width-s)/2,y=(img.height-s)/2;
      c.getContext("2d").drawImage(img,x,y,s,s,0,0,240,240);
      res(c.toDataURL("image/jpeg",0.8));
    };
    img.onerror=rej;
    img.src=URL.createObjectURL(file);
  });
}

async function listaClientes(){
  const cs=await db("GET","perfiles","?rol=eq.cliente&order=nombre.asc&select=id,nombre,foto");
  shell(`<div class="card"><h2>Clientes (${cs.length})</h2>
    ${cs.length?"":`<p class="muted">Todavía no hay clientes. Se registran ellos desde la pantalla de inicio.</p>`}
    ${cs.map(c=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0">
      <span>${c.foto?`<img class="avatar" src="${c.foto}" alt=""> `:""}${esc(c.nombre||"Sin nombre")}</span>
      <button data-c="${c.id}">Abrir</button></div>`).join("")}</div>`);
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>fichaCliente(b.dataset.c));
}
async function fichaCliente(id){
  const [c]=await db("GET","perfiles",`?id=eq.${id}&select=*`);
  const ses=await db("GET","sesiones",`?cliente_id=eq.${id}&order=created_at.desc&select=*`);
  shell(`<button class="sec" id="volver">← Clientes</button>
    <div class="card"><h2>${esc(c.nombre||"Sin nombre")}</h2>
    <div class="tabs"><button id="ta" class="on">Entrenamientos</button><button id="tb">Anamnesis</button></div>
    <div id="tab"></div></div>`);
  $("#volver").onclick=listaClientes;

  const verEntrenos=()=>{
    const e=estadisticas(ses);
    $("#tab").innerHTML=`
      <div class="row"><label>Subir hoja de Excel <input type="file" id="xls" accept=".xlsx,.xls,.csv"></label></div>
      <div class="msg" id="m"></div>
      <div class="stats">
        <div class="stat">Sesiones<b>${e.sesiones}</b></div>
        <div class="stat">RPE medio<b>${e.rpe}</b></div>
        <div class="stat">RIR medio<b>${e.rir}</b></div>
        <div class="stat">Reps totales<b>${e.reps}</b></div>
      </div>
      ${ses.map(s=>`<details class="card"><summary><b>${esc(s.titulo||"Sesión")}</b> · ${esc(s.fecha)}
        <button class="danger" data-del="${s.id}" style="float:right">Borrar</button></summary>${sesionHTML(s,false)}</details>`).join("")
        || `<p class="muted">Sin entrenamientos. Sube el Excel arriba.</p>`}`;
    $("#xls").onchange=async ev=>{
      const f=ev.target.files[0];if(!f)return;
      try{
        const lote=await leerExcel(f);
        if(!lote.length) throw new Error("No encuentro datos en el archivo.");
        await db("POST","sesiones","",lote.map(s=>({cliente_id:id,fecha:s.fecha,titulo:s.titulo,bloques:s.bloques,registro:{}})),"return=minimal");
        fichaCliente(id);
      }catch(err){msg("#m",err.message,false)}
    };
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async ev=>{
      ev.preventDefault();ev.stopPropagation();
      if(!confirm("¿Borrar esta sesión? Se pierden también los registros del cliente.")) return;
      try{await db("DELETE","sesiones",`?id=eq.${b.dataset.del}`,null,"return=minimal");fichaCliente(id)}
      catch(err){alert(err.message)}
    });
  };
  const verAnam=()=>{
    $("#tab").innerHTML=c.anamnesis
      ? ANAM.map(([k,l])=>`<p><b>${l}:</b> ${esc(c.anamnesis[k]||"–")}</p>`).join("")
      : `<p class="muted">Todavía no ha rellenado la anamnesis.</p>`;
  };
  pestanas(["ta","tb"],[verEntrenos,verAnam]);
  verEntrenos();
}

/* ---------- Panel del cliente ---------- */
function panelCliente(tab){
  shell(`<div class="tabs"><button id="c1">Entrenamientos</button><button id="c2">Anamnesis</button><button id="c3">Perfil</button></div><div id="tab"></div>`);
  const fns=[tabEntrenos,tabAnamnesis,tabPerfil];
  pestanas(["c1","c2","c3"],fns);
  const idx={entrenamientos:0,anamnesis:1,perfil:2}[tab]||0;
  ["c1","c2","c3"].forEach((x,i)=>$("#"+x).classList.toggle("on",i===idx));
  fns[idx]();
}
async function tabEntrenos(){
  const ses=await db("GET","sesiones",`?cliente_id=eq.${S.user.id}&order=created_at.desc&select=*`);
  $("#tab").innerHTML=ses.length
    ? ses.map(s=>`<div class="card"><h3>${esc(s.titulo||"Sesión")} <span class="muted">${esc(s.fecha)}</span></h3>
        ${sesionHTML(s,true)}
        <div class="row"><button data-save="${s.id}">Guardar registro</button><span class="muted" data-st="${s.id}"></span></div></div>`).join("")
    : `<p class="muted">Todavía no tienes entrenamientos cargados.</p>`;
  document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.save;
    const st=document.querySelector(`[data-st="${id}"]`);
    try{
      await db("PATCH","sesiones",`?id=eq.${id}`,{registro:leerRegistro(b.closest(".card"))},"return=minimal");
      st.textContent="Guardado ✓";
    }catch(e){st.textContent="Error: "+e.message}
  });
}
function tabAnamnesis(){
  const a=S.perfil.anamnesis||{};
  $("#tab").innerHTML=`${ANAM.map(([k,l])=>`<label>${l}<textarea data-a="${k}">${esc(a[k]||"")}</textarea></label>`).join("")}
    <label><input type="checkbox" id="cons" ${a.consent?"checked":""}> Acepto que mis datos de salud se usen solo para preparar mi entrenamiento.</label>
    <div class="row" style="margin-top:10px"><button class="gold" id="guardarA">Guardar anamnesis</button><span class="msg" id="m"></span></div>`;
  $("#guardarA").onclick=async()=>{
    if(!$("#cons").checked) return msg("#m","Debes aceptar el consentimiento para guardar.",false);
    const data={consent:true};
    document.querySelectorAll("[data-a]").forEach(t=>data[t.dataset.a]=t.value.trim());
    try{
      await db("PATCH","perfiles",`?id=eq.${S.user.id}`,{anamnesis:data},"return=minimal");
      S.perfil.anamnesis=data;msg("#m","Guardado ✓",true);
    }catch(e){msg("#m",e.message,false)}
  };
}
function tabPerfil(){
  const p=S.perfil;
  $("#tab").innerHTML=`<div class="row">${p.foto?`<img class="avatar" style="width:90px;height:90px" src="${p.foto}" alt="">`:`<span class="muted">Sin foto</span>`}
    <label>Foto de perfil <input type="file" id="foto" accept="image/*"></label></div>
    <h3>Cambiar contraseña</h3>
    <input id="np" type="password" placeholder="Nueva contraseña (mín. 6 caracteres)">
    <button id="cp">Cambiar contraseña</button>
    <div class="msg" id="m"></div>`;
  $("#foto").onchange=async ev=>{
    const f=ev.target.files[0];if(!f)return;
    try{
      const d=await fotoAJPG(f);
      await db("PATCH","perfiles",`?id=eq.${S.user.id}`,{foto:d},"return=minimal");
      S.perfil.foto=d;panelCliente("perfil");
    }catch(e){msg("#m",e.message,false)}
  };
  $("#cp").onclick=async()=>{
    try{
      await auth("user",{password:$("#np").value},"PUT",S.access);
      msg("#m","Contraseña cambiada ✓",true);$("#np").value="";
    }catch(e){msg("#m",e.message,false)}
  };
}

/* ---------- Arranque ---------- */
async function init(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("type")==="recovery"&&h.get("access_token")){
    S={access:h.get("access_token"),refresh:h.get("refresh_token")};
    history.replaceState(null,"",location.pathname);
    return pantallaNuevaPass();
  }
  const g=leerSesion();
  if(g&&g.access){
    S={access:g.access,refresh:g.refresh};
    try{await cargarPerfil();return entrar()}
    catch(e){
      try{await refrescar();await cargarPerfil();return entrar()}
      catch(e2){S=null;guardarSesion()}
    }
  }
  pantallaLogin();
}
init().catch(()=>pantallaLogin());
</script>
