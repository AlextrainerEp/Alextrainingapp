<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Training Lab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 15px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-height: 90vh;
      overflow-y: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 15px;
    }

    .logo img {
      width: 100%;
      height: auto;
    }

    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 13px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .back-btn {
      background: #f5f5f5;
      color: #333;
      width: 100%;
      margin-bottom: 20px;
      text-align: left;
      padding-left: 15px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    .card {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      margin: 12px 0;
      border-left: 4px solid #667eea;
    }

    .card-title {
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }

    .card-text {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .error-box {
      background: #fee;
      border-left: 4px solid #f00;
      padding: 12px;
      border-radius: 6px;
      margin: 12px 0;
      color: #c00;
      font-size: 13px;
    }

    .success-box {
      background: #efe;
      border-left: 4px solid #0a0;
      padding: 12px;
      border-radius: 6px;
      margin: 12px 0;
      color: #060;
      font-size: 13px;
    }

    .info-box {
      background: #eef;
      border-left: 4px solid #00a;
      padding: 12px;
      border-radius: 6px;
      margin: 12px 0;
      color: #006;
      font-size: 13px;
    }

    .chat-box {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
      max-height: 300px;
      overflow-y: auto;
    }

    .chat-message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
    }

    .chat-message.entrenador {
      background: #e3f2fd;
      text-align: left;
      border-left: 3px solid #2196F3;
    }

    .chat-message.cliente {
      background: #f3e5f5;
      text-align: right;
      border-right: 3px solid #9c27b0;
    }

    .chat-message-time {
      font-size: 11px;
      color: #999;
      margin-top: 5px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
    }

    .tab {
      padding: 10px 15px;
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #667eea;
      font-weight: 600;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 25px;
      height: 25px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .rpe-selector {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin: 10px 0;
    }

    .rpe-btn {
      padding: 8px 12px;
      border: 2px solid #ddd;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .rpe-btn:hover {
      border-color: #667eea;
    }

    .rpe-btn.selected {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .workout-item {
      background: white;
      border: 1px solid #eee;
      padding: 15px;
      border-radius: 8px;
      margin: 12px 0;
    }

    .workout-header {
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .workout-date {
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <img src="https://raw.githubusercontent.com/AlextrainerEP/Alextrainingapp/main/assets/logo.png" alt="Logo">
      </div>
      <h1>Alex Training Lab</h1>
      <p class="subtitle">Tu entrenador personal online</p>
    </div>

    <!-- PÁGINA INICIO -->
    <div id="inicio" class="page active">
      <div class="button-group">
        <button class="btn-primary" onclick="showPage('login-cliente')">Ya tengo código</button>
        <button class="btn-primary" onclick="showPage('registro-cliente')">Quiero registrarme</button>
        <button class="btn-primary" onclick="showPage('login-admin')">Soy el entrenador</button>
      </div>
    </div>

    <!-- PÁGINA LOGIN CLIENTE -->
    <div id="login-cliente" class="page">
      <button class="back-btn" onclick="showPage('inicio')">← Volver</button>
      <h2 style="color: #333; margin-bottom: 20px;">Ingresa tu código</h2>
      
      <div class="form-group">
        <label>Tu código:</label>
        <input type="text" id="codigoLogin" placeholder="Ej: K7M9P" maxlength="6">
      </div>

      <button class="btn-primary" onclick="loginCliente()" style="width: 100%;">Entrar</button>
      <div id="loginClienteError"></div>
    </div>

    <!-- PÁGINA REGISTRO CLIENTE -->
    <div id="registro-cliente" class="page">
      <button class="back-btn" onclick="showPage('inicio')">← Volver</button>
      <h2 style="color: #333; margin-bottom: 20px;">Crea tu cuenta</h2>
      <p class="subtitle">Rellena tus datos para comenzar</p>

      <div class="form-group">
        <label>Nombre y apellidos:</label>
        <input type="text" id="nombreRegistro" placeholder="Tu nombre completo">
      </div>

      <button class="btn-primary" onclick="registrarCliente()" style="width: 100%;">Crear mi cuenta</button>
      <div id="registroClienteError"></div>
    </div>

    <!-- PÁGINA LOGIN ADMIN -->
    <div id="login-admin" class="page">
      <button class="back-btn" onclick="showPage('inicio')">← Volver</button>
      <h2 style="color: #333; margin-bottom: 20px;">Acceso de entrenador</h2>

      <div class="form-group">
        <label>Usuario:</label>
        <input type="text" id="adminUser" placeholder="usuario">
      </div>

      <div class="form-group">
        <label>Contraseña:</label>
        <input type="password" id="adminPass" placeholder="contraseña">
      </div>

      <button class="btn-primary" onclick="loginAdmin()" style="width: 100%;">Entrar</button>
      <div id="loginAdminError"></div>
    </div>

    <!-- PÁGINA PANEL CLIENTE -->
    <div id="panel-cliente" class="page">
      <button class="back-btn" onclick="logout()">← Salir</button>
      <h2 id="nombreClienteDisplay" style="color: #667eea; margin-bottom: 20px;"></h2>

      <div class="tabs">
        <button class="tab active" onclick="switchClienteTab('entrenamientos')">Entrenamientos</button>
        <button class="tab" onclick="switchClienteTab('historial')">Historial</button>
        <button class="tab" onclick="switchClienteTab('chat')">Mensajes</button>
      </div>

      <!-- TAB: Entrenamientos -->
      <div id="tab-entrenamientos" class="tab-content">
        <div id="entrenamientosHoy"></div>
      </div>

      <!-- TAB: Historial -->
      <div id="tab-historial" class="tab-content" style="display: none;">
        <div id="historialCliente"></div>
      </div>

      <!-- TAB: Chat -->
      <div id="tab-chat" class="tab-content" style="display: none;">
        <div class="chat-box" id="chatCliente"></div>
        <div class="form-group">
          <textarea id="mensajeCliente" placeholder="Escribe tu mensaje..." rows="3"></textarea>
          <button class="btn-primary" onclick="enviarMensajeCliente()" style="width: 100%;">Enviar</button>
        </div>
      </div>
    </div>

    <!-- PÁGINA PANEL ADMIN -->
    <div id="panel-admin" class="page">
      <button class="back-btn" onclick="logout()">← Salir</button>
      <h2 style="color: #333; margin-bottom: 20px;">Panel del entrenador</h2>

      <div class="tabs">
        <button class="tab active" onclick="switchAdminTab('crear')">Crear Entrenamiento</button>
        <button class="tab" onclick="switchAdminTab('clientes')">Mis Clientes</button>
        <button class="tab" onclick="switchAdminTab('mensajes')">Mensajes</button>
      </div>

      <!-- TAB: Crear Entrenamiento -->
      <div id="tab-crear" class="tab-content">
        <div class="form-group">
          <label>Selecciona cliente:</label>
          <select id="selectClienteAdmin" onchange="cargarClienteAdmin()">
            <option value="">-- Selecciona un cliente --</option>
          </select>
        </div>

        <div id="formEntrenamiento" style="display: none;">
          <div class="form-group">
            <label>Fecha:</label>
            <input type="date" id="fechaEntrenamiento">
          </div>

          <div class="form-group">
            <label>Título (ej: Día de pierna):</label>
            <input type="text" id="tituloEntrenamiento" placeholder="Título del entrenamiento">
          </div>

          <div class="form-group">
            <label>Descripción:</label>
            <textarea id="descripcionEntrenamiento" placeholder="Detalles del entrenamiento..." rows="4"></textarea>
          </div>

          <div class="form-group">
            <label>Ejercicios (formato: Nombre - Series x Reps):</label>
            <textarea id="ejerciciosEntrenamiento" placeholder="Ejemplo:&#10;Sentadilla - 4x8&#10;Prensa - 3x10&#10;Leg curl - 3x12" rows="4"></textarea>
          </div>

          <button class="btn-primary" onclick="crearEntrenamiento()" style="width: 100%;">Crear Entrenamiento</button>
          <div id="crearEntrenamientoError"></div>
        </div>
      </div>

      <!-- TAB: Mis Clientes -->
      <div id="tab-clientes" class="tab-content" style="display: none;">
        <div id="listadoClientes"></div>
      </div>

      <!-- TAB: Mensajes -->
      <div id="tab-mensajes" class="tab-content" style="display: none;">
        <div class="form-group">
          <label>Selecciona cliente:</label>
          <select id="selectClienteMensaje" onchange="cargarChatAdmin()">
            <option value="">-- Selecciona un cliente --</option>
          </select>
        </div>

        <div class="chat-box" id="chatAdmin"></div>
        <div class="form-group">
          <textarea id="mensajeAdmin" placeholder="Escribe tu respuesta..." rows="3"></textarea>
          <button class="btn-primary" onclick="enviarMensajeAdmin()" style="width: 100%;">Enviar</button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    // ========================================
    // CONFIGURACIÓN SUPABASE
    // ========================================
    const SUPABASE_URL = 'https://zxarhydagapzgozrxaee.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_pcdggueDF2w9LVHDhvRpWg_NhLd1jb9';

    let db = null;
    let clienteActual = null;
    let adminActual = false;
    let clienteSeleccionadoAdmin = null;

    async function inicializarSupabase() {
      try {
        const { createClient } = window.supabase;
        db = createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log('✅ Supabase inicializado');
      } catch (error) {
        console.error('❌ Error Supabase:', error);
      }
    }

    // ========================================
    // NAVEGACIÓN Y TABS
    // ========================================
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById(pageId)?.classList.add('active');
    }

    function switchClienteTab(tabName) {
      document.querySelectorAll('#panel-cliente .tab-content').forEach(el => el.style.display = 'none');
      document.getElementById('tab-' + tabName).style.display = 'block';
      document.querySelectorAll('#panel-cliente .tab').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');
      
      if (tabName === 'entrenamientos') cargarEntrenamientosCliente();
      if (tabName === 'historial') cargarHistorialCliente();
      if (tabName === 'chat') cargarChatCliente();
    }

    function switchAdminTab(tabName) {
      document.querySelectorAll('#panel-admin .tab-content').forEach(el => el.style.display = 'none');
      document.getElementById('tab-' + tabName).style.display = 'block';
      document.querySelectorAll('#panel-admin .tab').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');
      
      if (tabName === 'clientes') cargarClientesAdmin();
    }

    // ========================================
    // REGISTRO Y LOGIN
    // ========================================
    async function registrarCliente() {
      const nombre = document.getElementById('nombreRegistro').value.trim();
      const errorDiv = document.getElementById('registroClienteError');
      errorDiv.innerHTML = '';

      if (!nombre) {
        errorDiv.innerHTML = '<div class="error-box">Por favor, ingresa tu nombre</div>';
        return;
      }

      try {
        errorDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Creando cuenta...</div>';

        const numeroCliente = Date.now() % 10000;
        const codigo = 'K' + Math.random().toString(36).substring(2, 7).toUpperCase();

        const { error } = await db.from('clientes').insert([{
          id: 'Usuario-' + numeroCliente,
          nombre: nombre,
          codigo: codigo,
          foto: null
        }]);

        if (error) throw error;

        errorDiv.innerHTML = `<div class="success-box">✅ Cuenta creada. Tu código es: <strong>${codigo}</strong><br>Cópialo para acceder.</div>`;
        document.getElementById('nombreRegistro').value = '';

      } catch (error) {
        errorDiv.innerHTML = `<div class="error-box">Error: ${error.message}</div>`;
      }
    }

    async function loginCliente() {
      const codigo = document.getElementById('codigoLogin').value.trim().toUpperCase();
      const errorDiv = document.getElementById('loginClienteError');
      errorDiv.innerHTML = '';

      if (!codigo) {
        errorDiv.innerHTML = '<div class="error-box">Por favor, ingresa tu código</div>';
        return;
      }

      try {
        errorDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Verificando...</div>';

        const { data, error } = await db.from('clientes').select('*').eq('codigo', codigo);

        if (error) throw error;
        if (!data || data.length === 0) {
          errorDiv.innerHTML = '<div class="error-box">Código no válido</div>';
          return;
        }

        clienteActual = data[0];
        adminActual = false;
        document.getElementById('nombreClienteDisplay').textContent = clienteActual.nombre;
        showPage('panel-cliente');
        cargarEntrenamientosCliente();

      } catch (error) {
        errorDiv.innerHTML = `<div class="error-box">Error: ${error.message}</div>`;
      }
    }

    function loginAdmin() {
      const user = document.getElementById('adminUser').value;
      const pass = document.getElementById('adminPass').value;
      const errorDiv = document.getElementById('loginAdminError');
      errorDiv.innerHTML = '';

      if (user === 'admin' && pass === 'admin123') {
        adminActual = true;
        showPage('panel-admin');
        cargarClientesParaAdmin();
      } else {
        errorDiv.innerHTML = '<div class="error-box">Usuario o contraseña incorrectos</div>';
      }
    }

    // ========================================
    // PANEL CLIENTE - ENTRENAMIENTOS
    // ========================================
    async function cargarEntrenamientosCliente() {
      if (!clienteActual) return;

      try {
        const hoy = new Date().toISOString().split('T')[0];
        const { data, error } = await db.from('entrenamientos')
          .select('*')
          .eq('cliente_id', clienteActual.id)
          .gte('fecha', hoy)
          .limit(10);

        if (error) throw error;

        const div = document.getElementById('entrenamientosHoy');
        if (!data || data.length === 0) {
          div.innerHTML = '<div class="info-box">No tienes entrenamientos asignados aún</div>';
          return;
        }

        div.innerHTML = data.map(e => `
          <div class="workout-item">
            <div class="workout-header">
              <span>${e.datos?.titulo || 'Entrenamiento'}</span>
              <span class="workout-date">${e.fecha}</span>
            </div>
            <div class="card-text">${e.datos?.descripcion || ''}</div>
            ${e.datos?.ejercicios ? '<div style="margin-top: 10px; color: #667eea; font-weight: 600;">Ejercicios:<br>' + e.datos.ejercicios.split('\n').join('<br>') + '</div>' : ''}
            <div style="margin-top: 12px;">
              <label>Mi RPE:</label>
              <div class="rpe-selector" id="rpe-${e.id}">
                <button class="rpe-btn" onclick="registrarRPE('${e.id}', 0)">0</button>
                <button class="rpe-btn" onclick="registrarRPE('${e.id}', 1)">1</button>
                <button class="rpe-btn" onclick="registrarRPE('${e.id}', 2)">2</button>
                <button class="rpe-btn" onclick="registrarRPE('${e.id}', 3)">3</button>
                <button class="rpe-btn" onclick="registrarRPE('${e.id}', 4)">4</button>
                <button class="rpe-btn" onclick="registrarRPE('${e.id}', 5)">5</button>
                <button class="rpe-btn" onclick="registrarRPE('${e.id}', 6)">6</button>
                <button class="rpe-btn" onclick="registrarRPE('${e.id}', 7)">7</button>
                <button class="rpe-btn" onclick="registrarRPE('${e.id}', 8)">8</button>
                <button class="rpe-btn" onclick="registrarRPE('${e.id}', 9)">9</button>
                <button class="rpe-btn" onclick="registrarRPE('${e.id}', 10)">10</button>
              </div>
            </div>
          </div>
        `).join('');

      } catch (error) {
        document.getElementById('entrenamientosHoy').innerHTML = `<div class="error-box">Error: ${error.message}</div>`;
      }
    }

    function registrarRPE(entrenamientoId, rpe) {
      alert(`RPE registrado: ${rpe}\n(Esta funcionalidad se guardará en la siguiente versión)`);
      document.querySelectorAll(`#rpe-${entrenamientoId} .rpe-btn`).forEach(btn => btn.classList.remove('selected'));
      event.target.classList.add('selected');
    }

    async function cargarHistorialCliente() {
      if (!clienteActual) return;

      try {
        const { data, error } = await db.from('entrenamientos')
          .select('*')
          .eq('cliente_id', clienteActual.id)
          .order('fecha', { ascending: false });

        if (error) throw error;

        const div = document.getElementById('historialCliente');
        if (!data || data.length === 0) {
          div.innerHTML = '<div class="info-box">No hay historial aún</div>';
          return;
        }

        div.innerHTML = data.map(e => `
          <div class="card">
            <div class="card-title">${e.datos?.titulo || 'Entrenamiento'}</div>
            <div class="card-text">
              Fecha: ${e.fecha}<br>
              ${e.datos?.descripcion || ''}<br>
              <em style="color: #999;">Estado: ${e.estado || 'pendiente'}</em>
            </div>
          </div>
        `).join('');

      } catch (error) {
        document.getElementById('historialCliente').innerHTML = `<div class="error-box">Error: ${error.message}</div>`;
      }
    }

    async function cargarChatCliente() {
      if (!clienteActual) return;

      try {
        const { data, error } = await db.from('mensajes')
          .select('*')
          .eq('cliente_id', clienteActual.id)
          .order('fecha', { ascending: true });

        if (error) throw error;

        const div = document.getElementById('chatCliente');
        if (!data || data.length === 0) {
          div.innerHTML = '<div class="info-box">Sin mensajes aún</div>';
          return;
        }

        div.innerHTML = data.map(m => `
          <div class="chat-message ${m.remitente}">
            <strong>${m.remitente === 'entrenador' ? 'Alex' : 'Tú'}:</strong><br>
            ${m.mensaje}
            <div class="chat-message-time">${new Date(m.fecha).toLocaleString('es-ES')}</div>
          </div>
        `).join('');

        div.scrollTop = div.scrollHeight;

      } catch (error) {
        document.getElementById('chatCliente').innerHTML = `<div class="error-box">Error: ${error.message}</div>`;
      }
    }

    async function enviarMensajeCliente() {
      const mensaje = document.getElementById('mensajeCliente').value.trim();
      if (!mensaje || !clienteActual) return;

      try {
        const { error } = await db.from('mensajes').insert([{
          cliente_id: clienteActual.id,
          remitente: 'cliente',
          mensaje: mensaje,
          fecha: new Date().toISOString()
        }]);

        if (error) throw error;

        document.getElementById('mensajeCliente').value = '';
        cargarChatCliente();

      } catch (error) {
        alert('Error al enviar: ' + error.message);
      }
    }

    // ========================================
    // PANEL ADMIN - ENTRENAMIENTOS
    // ========================================
    async function cargarClientesParaAdmin() {
      try {
        const { data, error } = await db.from('clientes').select('id, nombre');
        if (error) throw error;

        const select = document.getElementById('selectClienteAdmin');
        const selectMensaje = document.getElementById('selectClienteMensaje');
        
        [select, selectMensaje].forEach(s => {
          s.innerHTML = '<option value="">-- Selecciona un cliente --</option>';
          data?.forEach(c => {
            s.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
          });
        });
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function cargarClienteAdmin() {
      const id = document.getElementById('selectClienteAdmin').value;
      clienteSeleccionadoAdmin = id;
      document.getElementById('formEntrenamiento').style.display = id ? 'block' : 'none';
    }

    async function crearEntrenamiento() {
      if (!clienteSeleccionadoAdmin) {
        alert('Selecciona un cliente');
        return;
      }

      const fecha = document.getElementById('fechaEntrenamiento').value;
      const titulo = document.getElementById('tituloEntrenamiento').value;
      const descripcion = document.getElementById('descripcionEntrenamiento').value;
      const ejercicios = document.getElementById('ejerciciosEntrenamiento').value;
      const errorDiv = document.getElementById('crearEntrenamientoError');

      if (!fecha || !titulo) {
        errorDiv.innerHTML = '<div class="error-box">Completa los campos requeridos</div>';
        return;
      }

      try {
        errorDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Creando...</div>';

        const { error } = await db.from('entrenamientos').insert([{
          cliente_id: clienteSeleccionadoAdmin,
          fecha: fecha,
          datos: {
            titulo: titulo,
            descripcion: descripcion,
            ejercicios: ejercicios
          },
          estado: 'pendiente'
        }]);

        if (error) throw error;

        errorDiv.innerHTML = '<div class="success-box">✅ Entrenamiento creado</div>';
        document.getElementById('fechaEntrenamiento').value = '';
        document.getElementById('tituloEntrenamiento').value = '';
        document.getElementById('descripcionEntrenamiento').value = '';
        document.getElementById('ejerciciosEntrenamiento').value = '';

      } catch (error) {
        errorDiv.innerHTML = `<div class="error-box">Error: ${error.message}</div>`;
      }
    }

    async function cargarClientesAdmin() {
      try {
        const { data, error } = await db.from('clientes').select('*');
        if (error) throw error;

        const div = document.getElementById('listadoClientes');
        if (!data || data.length === 0) {
          div.innerHTML = '<div class="info-box">Sin clientes</div>';
          return;
        }

        div.innerHTML = data.map(c => `
          <div class="card">
            <div class="card-title">${c.nombre}</div>
            <div class="card-text">
              Código: <strong>${c.codigo}</strong><br>
              ID: ${c.id}
            </div>
          </div>
        `).join('');

      } catch (error) {
        document.getElementById('listadoClientes').innerHTML = `<div class="error-box">Error: ${error.message}</div>`;
      }
    }

    async function cargarChatAdmin() {
      const clienteId = document.getElementById('selectClienteMensaje').value;
      if (!clienteId) return;

      try {
        const { data, error } = await db.from('mensajes')
          .select('*')
          .eq('cliente_id', clienteId)
          .order('fecha', { ascending: true });

        if (error) throw error;

        const div = document.getElementById('chatAdmin');
        if (!data || data.length === 0) {
          div.innerHTML = '<div class="info-box">Sin mensajes</div>';
          return;
        }

        div.innerHTML = data.map(m => `
          <div class="chat-message ${m.remitente}">
            <strong>${m.remitente === 'entrenador' ? 'Tú' : 'Cliente'}:</strong><br>
            ${m.mensaje}
            <div class="chat-message-time">${new Date(m.fecha).toLocaleString('es-ES')}</div>
          </div>
        `).join('');

        div.scrollTop = div.scrollHeight;

      } catch (error) {
        document.getElementById('chatAdmin').innerHTML = `<div class="error-box">Error: ${error.message}</div>`;
      }
    }

    async function enviarMensajeAdmin() {
      const clienteId = document.getElementById('selectClienteMensaje').value;
      const mensaje = document.getElementById('mensajeAdmin').value.trim();
      
      if (!clienteId || !mensaje) return;

      try {
        const { error } = await db.from('mensajes').insert([{
          cliente_id: clienteId,
          remitente: 'entrenador',
          mensaje: mensaje,
          fecha: new Date().toISOString()
        }]);

        if (error) throw error;

        document.getElementById('mensajeAdmin').value = '';
        cargarChatAdmin();

      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    // ========================================
    // LOGOUT
    // ========================================
    function logout() {
      clienteActual = null;
      adminActual = false;
      showPage('inicio');
    }

    // ========================================
    // INICIALIZAR
    // ========================================
    window.addEventListener('load', () => {
      inicializarSupabase();
    });
  </script>
</body>
</html>
