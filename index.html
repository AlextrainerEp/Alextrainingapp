<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Training Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d4af37;
            --dark: #0f0f0f;
            --dark-alt: #1a1a1a;
            --light: #e0e0e0;
            --gray: #999;
            --success: #4caf50;
            --danger: #f44336;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f8f9fa;
            color: #333;
        }

        /* HEADER */
        .app-header {
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark-alt) 100%);
            border-bottom: 3px solid var(--primary);
            padding: 14px 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
        }

        .header-logo {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid var(--primary);
            overflow: hidden;
        }

        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-text {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 1.1em;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .header-subtitle {
            font-size: 0.7em;
            color: #999;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--light);
            font-size: 0.95em;
            font-weight: 600;
        }

        .badge {
            background: var(--primary);
            color: var(--dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 700;
        }

        .logout-btn {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: var(--primary);
            color: var(--dark);
        }

        /* HERO LOGIN */
        .hero-section {
            background: linear-gradient(135deg, rgba(15, 15, 15, 0.85) 0%, rgba(26, 26, 26, 0.85) 50%, rgba(15, 15, 15, 0.85) 100%), 
                        url('assets/logo.jpeg') center/cover no-repeat;
            background-attachment: fixed;
            padding: 80px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-content {
            max-width: 500px;
            width: 100%;
        }

        .hero-logo {
            text-align: center;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .hero-logo img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
        }

        .hero-text {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-text h1 {
            font-size: 2.5em;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .hero-text .tagline {
            font-size: 1.1em;
            color: var(--light);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* MAIN */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* SECTION BANNER */
        .section-banner {
            background: linear-gradient(to right, rgba(15, 15, 15, 0.95) 0%, rgba(26, 26, 26, 0.95) 50%, rgba(15, 15, 15, 0.95) 100%);
            border-left: 4px solid var(--primary);
            padding: 24px 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .section-logo {
            flex: 0 0 80px;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .section-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .section-text {
            flex: 1;
            color: white;
        }

        .section-text h2 {
            font-size: 1.4em;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .section-text p {
            font-size: 0.95em;
            color: #a0a0a0;
        }

        /* TABS */
        .tabs-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 0;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 16px 24px;
            font-size: 1em;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: color 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--primary);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* CARD */
        .card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .card h3 {
            color: var(--dark);
            margin-bottom: 16px;
            font-size: 1.2em;
        }

        /* FORMS */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px dashed var(--primary);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            color: var(--primary);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .file-input-label:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        /* BUTTONS */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #e0c57d 100%);
            color: var(--dark);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-secondary {
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        /* ALERTS */
        .alert {
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid var(--success);
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid var(--danger);
        }

        .alert-info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #2196f3;
        }

        .hidden {
            display: none;
        }

        .workout-item {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 4px solid var(--primary);
        }

        .workout-item h4 {
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .workout-item p {
            color: #666;
            margin: 4px 0;
            font-size: 0.95em;
        }

        .table-responsive {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }

        table th {
            background: var(--dark);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        table tr:hover {
            background: #f9f9f9;
        }

        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .hero-text h1 {
                font-size: 1.8em;
            }

            .section-banner {
                flex-direction: column;
                text-align: center;
            }

            .tabs-nav {
                gap: 0;
            }

            .tab-btn {
                padding: 12px 16px;
                font-size: 0.9em;
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="app-header" id="appHeader">
        <div class="header-container">
            <div class="header-brand">
                <div class="header-logo">
                    <img src="assets/logo.jpeg" alt="Logo" onerror="this.style.display='none'">
                </div>
                <div class="header-text">
                    <div class="header-title">ALEX TRAINING LAB</div>
                    <div class="header-subtitle">Tu Entrenador Personal</div>
                </div>
            </div>
            <div class="header-user" id="headerUser">
                <span id="userName">Usuario</span>
                <span class="badge" id="userBadge">Cliente</span>
                <button class="logout-btn" id="logoutBtn">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="loginSection" class="hero-section">
        <div class="hero-content">
            <div class="hero-logo">
                <img src="assets/logo.jpeg" alt="Logo" onerror="this.style.display='none'">
            </div>
            <div class="hero-text">
                <h1>Alex Training Lab</h1>
                <p class="tagline">Tu Entrenador Personal</p>
            </div>

            <div class="card">
                <div id="alertContainer"></div>
                
                <div class="form-group">
                    <label>Tu Código o Contraseña</label>
                    <input type="text" id="loginInput" placeholder="Ingresa tu código de acceso o contraseña de entrenador" autofocus>
                </div>

                <button class="btn btn-primary" id="btnLogin" style="width: 100%; margin-top: 20px;">Acceder</button>

                <p style="text-align: center; margin-top: 16px; color: #999; font-size: 0.9em;">
                    💡 Clientes: ingresa tu código de acceso<br>
                    🏋️ Entrenador: ingresa "Alex app"
                </p>
            </div>
        </div>
    </div>

    <!-- APP -->
    <div id="appSection" class="hidden">
        <div class="main-container">
            <!-- Banner -->
            <div class="section-banner">
                <div class="section-logo">
                    <img src="assets/logo.jpeg" alt="Logo" onerror="this.style.display='none'">
                </div>
                <div class="section-text">
                    <h2 id="bannerTitle">Mis Entrenamientos</h2>
                    <p id="bannerDesc">Aquí encontrarás tu programa personalizado</p>
                </div>
            </div>

            <!-- Alertas -->
            <div id="appAlerts"></div>

            <!-- Tabs -->
            <div class="tabs-nav" id="tabsNav"></div>

            <!-- Tab: Entrenamientos (Cliente) -->
            <div id="tabEntrenamientos" class="tab-content"></div>

            <!-- Tab: Historial (Cliente) -->
            <div id="tabHistorial" class="tab-content"></div>

            <!-- Tab: Perfil (Cliente) -->
            <div id="tabPerfil" class="tab-content"></div>

            <!-- Tab: Subir Excel (Admin) -->
            <div id="tabExcel" class="tab-content"></div>

            <!-- Tab: Clientes (Admin) -->
            <div id="tabClientes" class="tab-content"></div>

            <!-- Tab: Mensajes -->
            <div id="tabMensajes" class="tab-content"></div>
        </div>
    </div>

    <script>
        // CONFIG
        const SUPABASE_URL = 'https://zxarhydagapzgozrxaee.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_pcdggueDF2w9LVHDhvRpWg_NhLd1jb9';
        const TRAINER_PASSWORD = 'Alex app';
        
        let supabaseClient = null;
        let currentUser = null;
        let isTrainer = false;

        // INIT SUPABASE
        async function initSupabase() {
            const { createClient } = window.supabase;
            supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // LOGIN ÚNICO
        async function loginUser() {
            const input = document.getElementById('loginInput').value.trim();

            if (!input) {
                showAlert('Ingresa tu código o contraseña', 'info');
                return;
            }

            // VERIFICAR SI ES ENTRENADOR
            if (input === TRAINER_PASSWORD) {
                currentUser = { nombre: 'Administrador', id: 'admin', codigo: 'ADMIN' };
                isTrainer = true;
                showApp();
                setupTrainerTabs();
                return;
            }

            // VERIFICAR SI ES CLIENTE
            try {
                const { data, error } = await supabaseClient
                    .from('clientes')
                    .select('*')
                    .eq('codigo', input)
                    .single();

                if (error || !data) {
                    showAlert('Código de acceso inválido', 'error');
                    return;
                }

                currentUser = data;
                isTrainer = false;
                showApp();
                setupClientTabs();
                loadClientWorkouts();
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error al conectar', 'error');
            }
        }

        // SHOW APP
        function showApp() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            document.getElementById('userName').textContent = currentUser.nombre || 'Usuario';
            document.getElementById('userBadge').textContent = isTrainer ? 'Entrenador' : 'Cliente';
            document.getElementById('userBadge').style.background = isTrainer ? '#2196f3' : '#4caf50';
        }

        // SETUP TABS CLIENTE
        function setupClientTabs() {
            const tabsNav = document.getElementById('tabsNav');
            tabsNav.innerHTML = `
                <button class="tab-btn active" onclick="showTab('Entrenamientos', event)">📅 Entrenamientos</button>
                <button class="tab-btn" onclick="showTab('Historial', event)">📊 Historial</button>
                <button class="tab-btn" onclick="showTab('Perfil', event)">👤 Perfil</button>
            `;

            document.getElementById('tabEntrenamientos').innerHTML = '<div class="card"><h3>Mis Entrenamientos</h3><div id="workoutsList"></div></div>';
            document.getElementById('tabHistorial').innerHTML = '<div class="card"><h3>Historial de Entrenamientos</h3><p style="color: #999;">Historial vacío</p></div>';
            document.getElementById('tabPerfil').innerHTML = `
                <div class="card">
                    <h3>Mi Perfil</h3>
                    <p><strong>Nombre:</strong> ${currentUser.nombre || 'N/A'}</p>
                    <p><strong>Código de Acceso:</strong> ${currentUser.codigo || 'N/A'}</p>
                    <p><strong>Email:</strong> ${currentUser.email || 'No registrado'}</p>
                </div>
            `;

            showTab('Entrenamientos');
        }

        // SETUP TABS ADMIN
        function setupTrainerTabs() {
            const tabsNav = document.getElementById('tabsNav');
            tabsNav.innerHTML = `
                <button class="tab-btn active" onclick="showTab('Excel', event)">📊 Subir Entrenamientos</button>
                <button class="tab-btn" onclick="showTab('Clientes', event)">👥 Mis Clientes</button>
                <button class="tab-btn" onclick="showTab('Mensajes', event)">💬 Mensajes</button>
            `;

            // Tab Excel
            document.getElementById('tabExcel').innerHTML = `
                <div class="card">
                    <h3>Subir Archivo Excel con Entrenamientos</h3>
                    <p style="color: #666; margin-bottom: 20px;">
                        Sube un archivo Excel con los entrenamientos. Columnas esperadas: 
                        <strong>Código Cliente | Fecha | Título | Descripción | Ejercicios</strong>
                    </p>
                    
                    <div class="form-group">
                        <label>Selecciona archivo Excel (.xlsx)</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="excelFile" accept=".xlsx,.xls" onchange="handleExcelUpload()">
                            <label for="excelFile" class="file-input-label">📁 Arrastra tu archivo aquí o haz click</label>
                        </div>
                    </div>

                    <div id="excelPreview"></div>
                </div>
            `;

            // Tab Clientes
            document.getElementById('tabClientes').innerHTML = `
                <div class="card">
                    <h3>Crear Nuevo Cliente</h3>
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="clientName" placeholder="Nombre del cliente">
                    </div>
                    <div class="form-group">
                        <label>Código de Acceso (único)</label>
                        <input type="text" id="clientCode" placeholder="Ej: CLI-001" maxlength="20">
                    </div>
                    <div class="form-group">
                        <label>Email (opcional)</label>
                        <input type="email" id="clientEmail" placeholder="email@ejemplo.com">
                    </div>
                    <button class="btn btn-primary" onclick="createClient()">Crear Cliente</button>
                </div>

                <div class="card">
                    <h3>Mis Clientes Registrados</h3>
                    <div id="clientsList"></div>
                </div>
            `;

            document.getElementById('tabMensajes').innerHTML = '<div class="card"><h3>Mensajes</h3><p style="color: #999;">Sin mensajes todavía</p></div>';

            showTab('Excel');
            loadClients();
        }

        // LOAD CLIENT WORKOUTS
        async function loadClientWorkouts() {
            try {
                const { data, error } = await supabaseClient
                    .from('entrenamientos')
                    .select('*')
                    .eq('cliente_codigo', currentUser.codigo)
                    .gte('fecha', new Date().toISOString().split('T')[0])
                    .order('fecha', { ascending: true });

                if (error) throw error;

                const container = document.getElementById('workoutsList');
                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="color: #999;">No hay entrenamientos asignados aún</p>';
                    return;
                }

                container.innerHTML = data.map(w => `
                    <div class="workout-item">
                        <h4>${w.titulo || 'Entrenamiento'}</h4>
                        <p><strong>Fecha:</strong> ${w.fecha}</p>
                        <p><strong>Descripción:</strong> ${w.descripcion || 'Sin descripción'}</p>
                        ${w.ejercicios ? `<p><strong>Ejercicios:</strong> ${w.ejercicios}</p>` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // HANDLE EXCEL UPLOAD
        function handleExcelUpload() {
            const file = document.getElementById('excelFile').files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet);

                    if (rows.length === 0) {
                        showAlert('El archivo Excel está vacío', 'error');
                        return;
                    }

                    showAlert(`Se cargarán ${rows.length} entrenamientos`, 'info');

                    // Preview
                    let preview = '<h4 style="margin-top: 20px;">Entrenamientos a cargar:</h4>';
                    preview += '<div class="table-responsive"><table>';
                    preview += '<thead><tr><th>Cliente</th><th>Fecha</th><th>Título</th><th>Descripción</th></tr></thead><tbody>';
                    
                    rows.slice(0, 5).forEach(row => {
                        preview += `<tr>
                            <td>${row['Código Cliente'] || row['codigo_cliente'] || '?'}</td>
                            <td>${row['Fecha'] || row['fecha'] || '?'}</td>
                            <td>${row['Título'] || row['titulo'] || '?'}</td>
                            <td>${(row['Descripción'] || row['descripcion'] || '?').substring(0, 30)}...</td>
                        </tr>`;
                    });
                    if (rows.length > 5) preview += `<tr><td colspan="4" style="text-align: center; color: #999;">... y ${rows.length - 5} más</td></tr>`;
                    preview += '</tbody></table></div>';
                    preview += `<button class="btn btn-primary" onclick="uploadToSupabase(event)">Cargar ${rows.length} Entrenamientos</button>`;

                    document.getElementById('excelPreview').innerHTML = preview;
                    window.excelData = rows;

                } catch (error) {
                    showAlert('Error al leer el archivo Excel', 'error');
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // UPLOAD TO SUPABASE
        async function uploadToSupabase(e) {
            e.target.disabled = true;
            e.target.textContent = 'Cargando...';

            try {
                const data = window.excelData.map(row => ({
                    cliente_codigo: row['Código Cliente'] || row['codigo_cliente'],
                    fecha: row['Fecha'] || row['fecha'],
                    titulo: row['Título'] || row['titulo'],
                    descripcion: row['Descripción'] || row['descripcion'],
                    ejercicios: row['Ejercicios'] || row['ejercicios'],
                    estado: 'activo'
                }));

                const { error } = await supabaseClient
                    .from('entrenamientos')
                    .insert(data);

                if (error) throw error;
                showAlert(`✅ ${data.length} entrenamientos cargados exitosamente`, 'success');
                document.getElementById('excelFile').value = '';
                document.getElementById('excelPreview').innerHTML = '';
            } catch (error) {
                showAlert('Error al cargar los entrenamientos', 'error');
                console.error(error);
            } finally {
                e.target.disabled = false;
                e.target.textContent = 'Cargar Entrenamientos';
            }
        }

        // CREATE CLIENT
        async function createClient() {
            const name = document.getElementById('clientName').value.trim();
            const code = document.getElementById('clientCode').value.trim();
            const email = document.getElementById('clientEmail').value.trim();

            if (!name || !code) {
                showAlert('Completa los campos requeridos', 'info');
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('clientes')
                    .insert([{ nombre: name, codigo: code, email: email }]);

                if (error) throw error;
                showAlert(`Cliente "${name}" creado exitosamente`, 'success');
                document.getElementById('clientName').value = '';
                document.getElementById('clientCode').value = '';
                document.getElementById('clientEmail').value = '';
                loadClients();
            } catch (error) {
                showAlert('Error al crear el cliente', 'error');
                console.error(error);
            }
        }

        // LOAD CLIENTS
        async function loadClients() {
            try {
                const { data } = await supabaseClient.from('clientes').select('*').order('nombre');
                const container = document.getElementById('clientsList');
                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="color: #999;">Sin clientes registrados aún</p>';
                    return;
                }

                container.innerHTML = '<div class="table-responsive"><table>' +
                    '<thead><tr><th>Nombre</th><th>Código</th><th>Email</th><th>Acción</th></tr></thead><tbody>' +
                    data.map(c => `<tr>
                        <td>${c.nombre}</td>
                        <td><strong>${c.codigo}</strong></td>
                        <td>${c.email || '—'}</td>
                        <td><button class="btn btn-danger" onclick="deleteClient('${c.id}')">Eliminar</button></td>
                    </tr>`).join('') +
                    '</tbody></table></div>';
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // DELETE CLIENT
        async function deleteClient(id) {
            if (!confirm('¿Eliminar este cliente? Se perderán sus entrenamientos.')) return;
            try {
                await supabaseClient.from('clientes').delete().eq('id', id);
                showAlert('Cliente eliminado', 'success');
                loadClients();
            } catch (error) {
                showAlert('Error al eliminar', 'error');
            }
        }

        // SHOW TAB
        function showTab(tabName, event) {
            if (event) {
                event.target.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                event.target.classList.add('active');
            }

            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab' + tabName)?.classList.add('active');

            const banners = {
                'Entrenamientos': ['Mis Entrenamientos', 'Tu programa personalizado del día en adelante'],
                'Historial': ['Historial', 'Revisa tu progreso y cargas'],
                'Perfil': ['Mi Perfil', 'Gestiona tu información personal'],
                'Excel': ['Subir Entrenamientos', 'Carga entrenamientos masivamente desde Excel'],
                'Clientes': ['Mis Clientes', 'Crea y gestiona tus clientes'],
                'Mensajes': ['Mensajes', 'Comunicación con tus clientes']
            };
            if (banners[tabName]) {
                document.getElementById('bannerTitle').textContent = banners[tabName][0];
                document.getElementById('bannerDesc').textContent = banners[tabName][1];
            }
        }

        // LOGOUT
        function logout() {
            currentUser = null;
            isTrainer = false;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('loginInput').value = '';
            document.getElementById('loginInput').focus();
        }

        // SHOW ALERT
        function showAlert(msg, type) {
            const containers = document.querySelectorAll('#alertContainer, #appAlerts');
            containers.forEach(container => {
                const div = document.createElement('div');
                div.className = 'alert show alert-' + type;
                div.textContent = msg;
                container.appendChild(div);
                setTimeout(() => div.remove(), 4000);
            });
        }

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            initSupabase();
            document.getElementById('btnLogin').addEventListener('click', loginUser);
            document.getElementById('loginInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginUser();
            });
            document.getElementById('logoutBtn').addEventListener('click', logout);
        });
    </script>
</body>
</html>
