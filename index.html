<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Training Lab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }
        
        .logo-section { text-align: center; margin-bottom: 30px; }
        .logo-section img { width: 120px; margin-bottom: 15px; }
        .logo-section h1 { font-size: 28px; color: #333; margin-bottom: 5px; }
        .logo-section p { font-size: 14px; color: #999; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        
        button { width: 100%; padding: 12px; background: #333; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        button:hover { background: #555; }
        button.blue { background: #667eea; }
        button.blue:hover { background: #5568d3; }
        
        .menu-buttons { display: flex; flex-direction: column; gap: 15px; }
        .menu-buttons button { margin: 0; }
        
        .hidden { display: none; }
        
        .back-btn { background: #999; margin-bottom: 20px; }
        .back-btn:hover { background: #bbb; }
        
        .code-display { 
            font-size: 32px; 
            font-weight: bold; 
            letter-spacing: 3px; 
            font-family: 'Courier New', monospace; 
            background: #f0f0f0; 
            border: 2px solid #333; 
            padding: 20px; 
            border-radius: 6px; 
            margin: 20px 0; 
            text-align: center;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 20px;
            border-radius: 6px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- INICIO -->
        <div id="inicio">
            <div class="logo-section">
                <img src="assets/logo.png" alt="Alex Training Lab" onerror="this.src='https://via.placeholder.com/120'">
                <h1>Alex Training Lab</h1>
                <p>Entrenamiento personal</p>
            </div>
            
            <h2 style="text-align: center; margin-bottom: 20px; font-size: 20px;">¿Quién eres?</h2>
            
            <div class="menu-buttons">
                <button onclick="showPage('login-cliente')">🔑 Cliente - Ya tengo código</button>
                <button onclick="showPage('registro-cliente')" class="blue">📝 Cliente - Quiero registrarme</button>
                <button onclick="showPage('login-admin')">👨‍💼 Soy el entrenador</button>
            </div>
        </div>
        
        <!-- LOGIN CLIENTE -->
        <div id="login-cliente" class="hidden">
            <button class="back-btn" onclick="showPage('inicio')">← Volver</button>
            <div class="logo-section">
                <h2>Accede con tu código</h2>
            </div>
            
            <div class="form-group">
                <label>Tu código de acceso</label>
                <input type="text" id="codigo-login" placeholder="Ej: K7M9P" maxlength="10">
            </div>
            
            <button onclick="loginCliente()">Acceder</button>
        </div>
        
        <!-- REGISTRO CLIENTE -->
        <div id="registro-cliente" class="hidden">
            <button class="back-btn" onclick="showPage('inicio')">← Volver</button>
            <div class="logo-section">
                <h2>Crea tu cuenta</h2>
                <p>Rellena tus datos para comenzar</p>
            </div>
            
            <div class="form-group">
                <label>Nombre y apellidos</label>
                <input type="text" id="reg-nombre" placeholder="Ej: Juan García">
            </div>
            
            <button onclick="registrarCliente()">Crear mi cuenta</button>
        </div>
        
        <!-- RESULTADO REGISTRO -->
        <div id="resultado-registro" class="hidden">
            <div class="logo-section">
                <h2>¡Cuenta creada!</h2>
            </div>
            
            <p style="text-align: center; color: #666; margin-bottom: 15px;">Tu código de acceso es:</p>
            
            <div class="code-display" id="codigo-mostrado">K7M9P</div>
            
            <button onclick="copiarCodigo()" class="blue">📋 Copiar código</button>
            <button onclick="irAlLogin()">Continuar →</button>
        </div>
        
        <!-- LOGIN ADMIN -->
        <div id="login-admin" class="hidden">
            <button class="back-btn" onclick="showPage('inicio')">← Volver</button>
            <div class="logo-section">
                <h2>Panel del entrenador</h2>
            </div>
            
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="admin-user" placeholder="usuario">
            </div>
            
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="admin-pass" placeholder="contraseña">
            </div>
            
            <button onclick="loginAdmin()">Acceder</button>
        </div>
        
        <!-- PANEL ADMIN -->
        <div id="panel-admin" class="hidden">
            <div class="logo-section">
                <h2>Panel del entrenador</h2>
            </div>
            
            <button class="back-btn" onclick="logout()">← Cerrar sesión</button>
            
            <h3 style="margin-bottom: 15px;">Crear nuevo cliente</h3>
            <div class="form-group">
                <label>Nombre del cliente</label>
                <input type="text" id="admin-nuevo-cliente" placeholder="Nombre">
            </div>
            <button onclick="crearClienteAdmin()">+ Crear cliente</button>
        </div>
        
        <!-- PANEL CLIENTE -->
        <div id="panel-cliente" class="hidden">
            <div class="logo-section">
                <h2>Mi entrenamiento</h2>
                <p id="nombre-cliente"></p>
            </div>
            
            <button class="back-btn" onclick="logout()">← Cerrar sesión</button>
            
            <p style="color: #999; padding: 20px; text-align: center;">No hay entrenamiento asignado hoy</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
        const { createClient } = window.supabase;
        
        const SUPABASE_URL = 'https://czarihydagapgqzqzasee.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6YXJpaHlkYWdhcGdxenF6YXNlZSIsInJvbGUiOiJhbm9uIiwiYWF0IjoxNzI3ODM2MzM2LCJleHAiOjIwNDM0MTIzMzZ9.c5fdk644a-3c_UfB90-ab544317b3c';
        
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);
        let clienteActual = null;
        let codigoActual = null;
        
        function showPage(pageName) {
            document.querySelectorAll('[id$="-cliente"], [id$="-admin"], [id$="-registro"], [id^="login"], [id^="panel"], [id^="resultado"], [id^="inicio"]').forEach(el => {
                el.classList.add('hidden');
            });
            document.getElementById(pageName).classList.remove('hidden');
        }
        
        function toast(msg) {
            const div = document.createElement('div');
            div.className = 'toast';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }
        
        async function loginCliente() {
            const codigo = document.getElementById('codigo-login').value.trim().toUpperCase();
            if (!codigo) { toast('Ingresa tu código'); return; }
            
            try {
                const { data, error } = await db.from('clientes').select('*').eq('codigo', codigo).single();
                if (error || !data) { toast('Código no válido'); return; }
                
                clienteActual = data;
                codigoActual = codigo;
                document.getElementById('nombre-cliente').textContent = data.nombre;
                showPage('panel-cliente');
            } catch (e) {
                toast('Error: ' + e.message);
            }
        }
        
        async function registrarCliente() {
            const nombre = document.getElementById('reg-nombre').value.trim();
            if (!nombre) { toast('Ingresa tu nombre'); return; }
            
            try {
                const codigoAleatorio = 'K' + Math.random().toString(36).substring(2, 7).toUpperCase();
                const id = 'cli_' + Date.now() + '_' + Math.random().toString(36).slice(-4);
                
                const { error } = await db.from('clientes').insert([{
                    id: id,
                    nombre: nombre,
                    codigo: codigoAleatorio,
                    foto: null
                }]);
                
                if (error) { toast('Error: ' + error.message); return; }
                
                codigoActual = codigoAleatorio;
                document.getElementById('codigo-mostrado').textContent = codigoAleatorio;
                showPage('resultado-registro');
            } catch (e) {
                toast('Error: ' + e.message);
            }
        }
        
        function copiarCodigo() {
            navigator.clipboard.writeText(document.getElementById('codigo-mostrado').textContent);
            toast('¡Código copiado!');
        }
        
        function irAlLogin() {
            document.getElementById('codigo-login').value = codigoActual;
            showPage('login-cliente');
        }
        
        function loginAdmin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            if (user === 'admin' && pass === 'admin123') {
                showPage('panel-admin');
            } else {
                toast('Usuario o contraseña incorrectos');
            }
        }
        
        async function crearClienteAdmin() {
            const nombre = document.getElementById('admin-nuevo-cliente').value.trim();
            if (!nombre) { toast('Ingresa el nombre'); return; }
            
            try {
                const codigoAleatorio = 'K' + Math.random().toString(36).substring(2, 7).toUpperCase();
                const id = 'cli_' + Date.now() + '_' + Math.random().toString(36).slice(-4);
                
                const { error } = await db.from('clientes').insert([{
                    id: id,
                    nombre: nombre,
                    codigo: codigoAleatorio,
                    foto: null
                }]);
                
                if (error) throw error;
                toast(`Cliente "${nombre}" creado con código ${codigoAleatorio}`);
                document.getElementById('admin-nuevo-cliente').value = '';
            } catch (e) {
                toast('Error: ' + e.message);
            }
        }
        
        function logout() {
            clienteActual = null;
            codigoActual = null;
            showPage('inicio');
            document.getElementById('codigo-login').value = '';
            document.getElementById('reg-nombre').value = '';
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-pass').value = '';
        }
    </script>
</body>
</html>
