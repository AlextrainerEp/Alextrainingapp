<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Training Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d4af37;
            --dark: #0f0f0f;
            --dark-alt: #1a1a1a;
            --light: #e0e0e0;
            --gray: #999;
            --success: #4caf50;
            --danger: #f44336;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f8f9fa;
            color: #333;
        }

        /* HEADER */
        .app-header {
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark-alt) 100%);
            border-bottom: 3px solid var(--primary);
            padding: 14px 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
        }

        .header-logo {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid var(--primary);
            overflow: hidden;
        }

        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-text {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 1.1em;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .header-subtitle {
            font-size: 0.7em;
            color: #999;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--light);
            font-size: 0.95em;
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: var(--primary);
            color: var(--dark);
        }

        /* HERO LOGIN */
        .hero-section {
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark-alt) 50%, var(--dark) 100%);
            padding: 80px 20px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-content {
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .hero-logo {
            flex: 0 1 200px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .hero-logo img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
        }

        .hero-text {
            flex: 1;
            min-width: 280px;
            color: white;
            text-align: left;
        }

        .hero-text h1 {
            font-size: 2.5em;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .hero-text .tagline {
            font-size: 1.2em;
            color: var(--light);
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero-text p {
            font-size: 1em;
            color: #b0b0b0;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* MAIN */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* SECTION BANNER */
        .section-banner {
            background: linear-gradient(to right, rgba(15, 15, 15, 0.95) 0%, rgba(26, 26, 26, 0.95) 50%, rgba(15, 15, 15, 0.95) 100%);
            border-left: 4px solid var(--primary);
            padding: 24px 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .section-logo {
            flex: 0 0 80px;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .section-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .section-text {
            flex: 1;
            color: white;
        }

        .section-text h2 {
            font-size: 1.4em;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .section-text p {
            font-size: 0.95em;
            color: #a0a0a0;
        }

        /* TABS */
        .tabs-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 0;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 16px 24px;
            font-size: 1em;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: color 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--primary);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* CARD */
        .card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .card h3 {
            color: var(--dark);
            margin-bottom: 16px;
            font-size: 1.2em;
        }

        /* FORMS */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        /* BUTTONS */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #e0c57d 100%);
            color: var(--dark);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-secondary {
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        /* ALERTS */
        .alert {
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid var(--success);
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid var(--danger);
        }

        .alert-info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #2196f3;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .hero-content {
                flex-direction: column;
                gap: 30px;
            }

            .hero-text h1 {
                font-size: 1.8em;
            }

            .section-banner {
                flex-direction: column;
                text-align: center;
            }

            .tabs-nav {
                gap: 0;
            }

            .tab-btn {
                padding: 12px 16px;
                font-size: 0.9em;
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="app-header" id="appHeader">
        <div class="header-container">
            <div class="header-brand">
                <div class="header-logo">
                    <img src="assets/logo.jpeg" alt="Logo" onerror="this.style.display='none'">
                </div>
                <div class="header-text">
                    <div class="header-title">ALEX TRAINING LAB</div>
                    <div class="header-subtitle">Tu Entrenador Personal</div>
                </div>
            </div>
            <div class="header-user" id="headerUser">
                <span id="userName">Usuario</span>
                <button class="logout-btn" id="logoutBtn">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="loginSection" class="hero-section">
        <div class="hero-content">
            <div class="hero-logo">
                <img src="assets/logo.jpeg" alt="Logo" onerror="this.style.display='none'">
            </div>
            <div class="hero-text">
                <h1>Alex Training Lab</h1>
                <p class="tagline">Tu Entrenador Personal</p>
                <p>Accede a tu programa personalizado de entrenamiento. Sigue tu progreso y alcanza tus objetivos.</p>
                
                <div class="card" style="margin-top: 20px;">
                    <div id="alertContainer"></div>

                    <h3 style="font-size: 1.1em;">Cliente</h3>
                    <div class="form-group">
                        <label>Código de Acceso</label>
                        <input type="text" id="loginCode" placeholder="Ej: CLI-001">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="loginPassword" placeholder="pass123">
                    </div>
                    <button class="btn btn-primary" id="btnLoginCliente" style="width: 100%;">Acceder como Cliente</button>

                    <hr style="margin: 30px 0; border: none; border-top: 1px solid #ddd;">

                    <h3 style="font-size: 1.1em; color: var(--dark);">Entrenador</h3>
                    <div class="form-group">
                        <label>Usuario</label>
                        <input type="text" id="adminUser" placeholder="admin">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="adminPass" placeholder="admin123">
                    </div>
                    <button class="btn btn-secondary" id="btnLoginAdmin" style="width: 100%;">Acceder como Entrenador</button>
                </div>
            </div>
        </div>
    </div>

    <!-- APP -->
    <div id="appSection" class="hidden">
        <div class="main-container">
            <!-- Banner -->
            <div class="section-banner">
                <div class="section-logo">
                    <img src="assets/logo.jpeg" alt="Logo" onerror="this.style.display='none'">
                </div>
                <div class="section-text">
                    <h2 id="bannerTitle">Mis Entrenamientos</h2>
                    <p id="bannerDesc">Aquí encontrarás tu programa personalizado</p>
                </div>
            </div>

            <!-- Alertas -->
            <div id="appAlerts"></div>

            <!-- Tabs -->
            <div class="tabs-nav" id="tabsNav"></div>

            <!-- Tab: Entrenamientos -->
            <div id="tabEntrenamientos" class="tab-content"></div>

            <!-- Tab: Historial -->
            <div id="tabHistorial" class="tab-content"></div>

            <!-- Tab: Perfil -->
            <div id="tabPerfil" class="tab-content"></div>

            <!-- Tab: Mensajes -->
            <div id="tabMensajes" class="tab-content"></div>

            <!-- Tab: Admin -->
            <div id="tabAdmin" class="tab-content"></div>
        </div>
    </div>

    <script>
        // CONFIG
        const SUPABASE_URL = 'https://zxarhydagapzgozrxaee.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_pcdggueDF2w9LVHDhvRpWg_NhLd1jb9';
        
        let supabaseClient = null;
        let currentUser = null;
        let isTrainer = false;

        // INIT SUPABASE
        async function initSupabase() {
            const { createClient } = window.supabase;
            supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // LOGIN CLIENTE
        async function loginCliente() {
            const code = document.getElementById('loginCode').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!code || !password) {
                showAlert('Completa todos los campos', 'info');
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('clientes')
                    .select('*')
                    .eq('codigo', code)
                    .single();

                if (error || !data) {
                    showAlert('Código de acceso inválido', 'error');
                    return;
                }

                if (password !== 'pass123') {
                    showAlert('Contraseña incorrecta', 'error');
                    return;
                }

                currentUser = data;
                isTrainer = false;
                showApp();
                setupClientTabs();
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error al conectar', 'error');
            }
        }

        // LOGIN ADMIN
        function loginAdmin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            if (user === 'admin' && pass === 'admin123') {
                currentUser = { nombre: 'Administrador', id: 'admin' };
                isTrainer = true;
                showApp();
                setupTrainerTabs();
            } else {
                showAlert('Credenciales incorrectas', 'error');
            }
        }

        // SHOW APP
        function showApp() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            document.getElementById('userName').textContent = currentUser.nombre || 'Usuario';
        }

        // SETUP TABS CLIENTE
        function setupClientTabs() {
            const tabsNav = document.getElementById('tabsNav');
            tabsNav.innerHTML = `
                <button class="tab-btn active" onclick="showTab('Entrenamientos', event)">📅 Entrenamientos</button>
                <button class="tab-btn" onclick="showTab('Historial', event)">📊 Historial</button>
                <button class="tab-btn" onclick="showTab('Perfil', event)">👤 Perfil</button>
                <button class="tab-btn" onclick="showTab('Mensajes', event)">💬 Mensajes</button>
            `;

            document.getElementById('tabEntrenamientos').innerHTML = '<div class="card"><h3>Entrenamientos de Hoy en Adelante</h3><p>Cargando entrenamientos...</p></div>';
            document.getElementById('tabHistorial').innerHTML = '<div class="card"><h3>Historial de Entrenamientos</h3><p>Historial vacío</p></div>';
            document.getElementById('tabPerfil').innerHTML = '<div class="card"><h3>Mi Perfil</h3><p>Nombre: ' + (currentUser.nombre || 'N/A') + '</p><p>Código: ' + (currentUser.codigo || 'N/A') + '</p></div>';
            document.getElementById('tabMensajes').innerHTML = '<div class="card"><h3>Mensajes</h3><p>Sin mensajes</p></div>';

            showTab('Entrenamientos');
        }

        // SETUP TABS ADMIN
        function setupTrainerTabs() {
            const tabsNav = document.getElementById('tabsNav');
            tabsNav.innerHTML = `
                <button class="tab-btn active" onclick="showTab('Admin', event)">⚙️ Panel Admin</button>
                <button class="tab-btn" onclick="showTab('Mensajes', event)">💬 Mensajes</button>
            `;

            document.getElementById('tabAdmin').innerHTML = `
                <div class="card">
                    <h3>Crear Entrenamiento</h3>
                    <div class="form-group">
                        <label>Cliente</label>
                        <select id="selectClient"><option>Selecciona un cliente</option></select>
                    </div>
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" id="workoutDate">
                    </div>
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" id="workoutTitle" placeholder="Ej: Upper Body A">
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="workoutDesc" placeholder="Detalles del entrenamiento"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="createWorkout()">Crear</button>
                </div>
            `;

            document.getElementById('tabMensajes').innerHTML = '<div class="card"><h3>Mensajes</h3><p>Sin mensajes</p></div>';

            showTab('Admin');
        }

        // SHOW TAB
        function showTab(tabName, event) {
            if (event) event.target.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (event) event.target.classList.add('active');

            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab' + tabName).classList.add('active');

            // Actualizar banner
            const banners = {
                'Entrenamientos': ['Mis Entrenamientos', 'Tu programa personalizado del día en adelante'],
                'Historial': ['Historial', 'Revisa tu progreso y cargas'],
                'Perfil': ['Mi Perfil', 'Gestiona tu información personal'],
                'Mensajes': ['Mensajes', 'Comunícate con tu entrenador'],
                'Admin': ['Panel Admin', 'Gestiona clientes y entrenamientos']
            };
            if (banners[tabName]) {
                document.getElementById('bannerTitle').textContent = banners[tabName][0];
                document.getElementById('bannerDesc').textContent = banners[tabName][1];
            }
        }

        // LOGOUT
        function logout() {
            currentUser = null;
            isTrainer = false;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('loginCode').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
        }

        // SHOW ALERT
        function showAlert(msg, type) {
            const container = document.getElementById('alertContainer') || document.getElementById('appAlerts');
            const div = document.createElement('div');
            div.className = 'alert show alert-' + type;
            div.textContent = msg;
            container.appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }

        // CREATE WORKOUT
        function createWorkout() {
            alert('Entrenamiento creado (demo)');
        }

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            initSupabase();
            document.getElementById('btnLoginCliente').addEventListener('click', loginCliente);
            document.getElementById('btnLoginAdmin').addEventListener('click', loginAdmin);
            document.getElementById('logoutBtn').addEventListener('click', logout);
        });
    </script>
</body>
</html>
