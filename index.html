function toast(msg){
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2500);
}

async function supabaseCall(method,endpoint,body){
  const opts={
    method,
    headers:{
      'Authorization':`Bearer ${SUPABASE_KEY}`,
      'Content-Type':'application/json',
      'apikey':SUPABASE_KEY
    }
  };
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(`${SUPABASE_URL}/rest/v1${endpoint}`,opts);
  if(!res.ok){
    const err=await res.json();
    throw new Error(err.message||'Error en Supabase');
  }
  return await res.json();
}

async function loginCliente(){
  const codigo=document.getElementById('codigo-input')?.value||'';
  if(!codigo.trim()){
    toast('Ingresa tu código');
    return;
  }
  try{
    const clientes=await supabaseCall('GET',`/clientes?codigo=eq.${codigo}`);
    if(!clientes.length){
      toast('Código no encontrado');
      return;
    }
    const cliente=clientes[0];
    U.miId=cliente.id;
    U.rol='cliente';
    U.tab=cliente.anamnesis_completada?'hoy':'anamnesis';
    U.loginTab='inicio';
    localStorage.setItem(LS+'codigo',codigo);
    render();
  }catch(e){
    toast('Error: '+e.message);
  }
}

async function guardarAnamnesis(){
  if(!U.miId)return;
  try{
    const cliente=D.clientes.find(c=>c.id===U.miId);
    if(!cliente)return;
    
    await supabaseCall('POST','/anamnesis',{
      id:'ana_'+Date.now()+'_'+Math.random().toString(36).slice(-4),
      cliente_id:U.miId,
      datos:JSON.stringify(U.anamnesisForm),
      creado:new Date().toISOString()
    });
    
    await supabaseCall('PATCH',`/clientes?id=eq.${U.miId}`,{
      anamnesis_completada:true
    });
    
    D.clientes=D.clientes.map(c=>c.id===U.miId?{...c,anamnesis_completada:true}:c);
    U.tab='hoy';
    U.anamnesisForm={};
    toast('Anamnesis guardada');
    render();
  }catch(e){
    toast('Error: '+e.message);
  }
}

  const expFuerza=['Ninguna','Menos de 6 meses','6 meses a 2 años','Más de 2 años'];
  html+='<div class="chips">';
  expFuerza.forEach(exp=>{
    const sel=U.anamnesisForm.expFuerza===exp;
    html+='<button class="chip" '+(sel?'aria-pressed="true"':'')+' onclick="handleAnamnesisChange(\'expFuerza\',\''+exp+'\'); render()">'+exp+'</button>';
  });
  html+='</div>';
  
  html+='<div class="section-break"><h3>6. Estilo de vida</h3></div>';
  html+='<label>Tipo de trabajo</label>';
  const tipoTrabajo=['Sedentario','De pie','Físicamente exigente','Turnos o viajes'];
  html+='<div class="chips">';
  tipoTrabajo.forEach(tipo=>{
    const sel=U.anamnesisForm.tipoTrabajo===tipo;
    html+='<button class="chip" '+(sel?'aria-pressed="true"':'')+' onclick="handleAnamnesisChange(\'tipoTrabajo\',\''+tipo+'\'); render()">'+tipo+'</button>';
  });
  html+='</div>';
  html+='<label style="margin-top:12px">Horas de sueño<input type="number" value="'+(U.anamnesisForm.sueno||'')+'" onchange="handleAnamnesisChange(\'sueno\',this.value)"></label>';
  html+='<label>¿Descansas bien?<textarea onchange="handleAnamnesisChange(\'descanso\',this.value)">'+(U.anamnesisForm.descanso||'')+'</textarea></label>';
  html+='<label>Nivel de estrés</label>';
  html+='<div class="scale big">';
  for(let i=1;i<=10;i++){
    const sel=(U.anamnesisForm.estres==i);
    html+='<button '+(sel?'aria-pressed="true"':'')+' onclick="handleAnamnesisChange(\'estres\','+i+'); render()">'+i+'</button>';
  }
  html+='</div>';
  
  html+='<div class="section-break"><h3>7. Alimentación</h3></div>';
  html+='<label>Agua al día (litros)<input type="number" step="0.5" value="'+(U.anamnesisForm.agua||'')+'" onchange="handleAnamnesisChange(\'agua\',this.value)"></label>';
  html+='<label>Preferencias o tipo de dieta<textarea onchange="handleAnamnesisChange(\'dieta\',this.value)">'+(U.anamnesisForm.dieta||'')+'</textarea></label>';
  
  html+='<div class="section-break"><h3>8. Logística a domicilio</h3></div>';
  html+='<label>Días disponibles para entrenar</label>';
  const dias=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  html+='<div class="chips">';
  dias.forEach(dia=>{
    const diasSel=(U.anamnesisForm.diasDisponibles||[]);
    const sel=diasSel.includes(dia);
    html+='<button class="chip" '+(sel?'aria-pressed="true"':'')+' onclick="handleAnamnesisChangeDia(\''+dia+'\'); render()">'+dia+'</button>';
  });
  html+='</div>';
  html+='<label style="margin-top:12px">Franja horaria preferida<input type="text" value="'+(U.anamnesisForm.franjaHoraria||'')+'" placeholder="Ej: 18:00-19:00"></label>';
  html+='<label>Sesiones por semana deseadas<input type="number" value="'+(U.anamnesisForm.sesionesporsemana||'')+'" onchange="handleAnamnesisChange(\'sesionesporsemana\',this.value)"></label>';
  html+='<label>Espacio disponible<textarea onchange="handleAnamnesisChange(\'espacio\',this.value)">'+(U.anamnesisForm.espacio||'')+'" placeholder="Salón, garaje, jardín, etc."></textarea></label>';
  html+='<label>Material que tienes en casa<textarea onchange="handleAnamnesisChange(\'material\',this.value)">'+(U.anamnesisForm.material||'')+'" placeholder="Mancuernas, barra, etc."></textarea></label>';
  
  html+='<div class="section-break"><h3>Declaración y consentimiento</h3></div>';
  html+='<label><input type="checkbox" onchange="handleAnamnesisChange(\'consentimiento\',this.checked)"> Declaro que la información es veraz y comunicaré cambios en mi salud</label>';
  html+='<label style="margin-top:8px"><input type="checkbox" onchange="handleAnamnesisChange(\'datosPersonales\',this.checked)"> Autorizo el tratamiento de mis datos personales</label>';
  html+='<label style="margin-top:8px"><input type="checkbox" onchange="handleAnamnesisChange(\'fotos\',this.checked)"> Autorizo fotos/vídeos de técnica para seguimiento</label>';
  
  html+='<div class="actions" style="margin-top:24px">';
  html+='<button class="btn primary full" onclick="guardarAnamnesis()">Guardar y continuar</button>';
  html+='</div>';
  html+='</div></main>';
  
  return html;
}

function handleAnamnesisChangeDia(dia){
  if(!U.anamnesisForm.diasDisponibles)U.anamnesisForm.diasDisponibles=[];
  if(U.anamnesisForm.diasDisponibles.includes(dia)){
    U.anamnesisForm.diasDisponibles=U.anamnesisForm.diasDisponibles.filter(d=>d!==dia);
  }else{
    U.anamnesisForm.diasDisponibles.push(dia);
  }
}

function renderClientePanel(){
  let html='<main><button class="btn logout-btn" onclick="logout()">Salir</button>';
  html+='<div class="panel">';
  html+='<h2>Panel Cliente</h2>';
  html+='<p class="hint">Aquí verás tus entrenamientos</p>';
  html+='<p class="empty">Tus entrenamientos aparecerán aquí</p>';
  html+='</div></main>';
  return html;
}

function renderAdminPanel(){
  let html='<main><button class="btn logout-btn" onclick="logout()">Salir</button>';
  
  if(U.tab==='admin-clientes'){
    html+='<div class="panel">';
    html+='<h2>Crear nuevo cliente</h2>';
    html+='<label>Nombre<input type="text" value="'+U.newClienteForm.nombre+'" onchange="U.newClienteForm.nombre=this.value"></label>';
    html+='<label>Código (ej: CLI-001)<input type="text" value="'+U.newClienteForm.codigo+'" onchange="U.newClienteForm.codigo=this.value"></label>';
    html+='<button class="btn primary full" onclick="crearCliente()">Crear cliente</button>';
    html+='</div>';
    
    html+='<div class="panel">';
    html+='<h2>Clientes</h2>';
    if(D.clientes.length===0){
      html+='<p class="empty">No hay clientes aún</p>';
    }else{
      D.clientes.forEach(c=>{
        html+='<div class="row">';
        html+='<div class="grow">';
        html+='<div class="name">'+c.nombre+'</div>';
        html+='<div class="hint">Código: <span class="code">'+c.codigo+'</span></div>';
        html+='<div class="hint">Anamnesis: '+(c.anamnesis_completada?'✓ Completa':'Pendiente')+'</div>';
        html+='</div></div>';
      });
    }
    html+='</div>';
  }
  
  html+='</main>';
  return html;
}

function render(){
  let html='';
  
  if(!U.rol){
    html=renderLogin();
  }else if(U.rol==='cliente'){
    if(U.tab==='anamnesis'){
      html=renderAnamnesisForm();
    }else{
      html=renderClientePanel();
    }
  }else if(U.rol==='admin'){
    html=renderAdminPanel();
  }
  
  document.getElementById('app').innerHTML=html;
}

async function init(){
  try{
    await cargarClientes();
    const codGuardado=localStorage.getItem(LS+'codigo');
    if(codGuardado){
      const cliente=D.clientes.find(c=>c.codigo===codGuardado);
      if(cliente){
        U.miId=cliente.id;
        U.rol='cliente';
        U.tab=cliente.anamnesis_completada?'hoy':'anamnesis';
      }
    }
    render();
  }catch(e){
    console.error('Error init:',e);
    render();
  }
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
