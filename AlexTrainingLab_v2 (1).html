/* ============ UTILIDADES ============ */

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd=n=>[...Array(n)].map(()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function db(method,table,query="",body){
  const r=await fetch(`${SB_URL}/rest/v1/${table}${query}`,{method,headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:body!==undefined?JSON.stringify(body):undefined});
  const t=await r.text(); if(!r.ok) throw new Error(t); return t?JSON.parse(t):[];
}
const RPE=[...Array(21)].map((_,i)=>i/2);
const RIR=[0,1,2,3,4,5];
const rpeLab=v=>v<=0?"Reposo":v<=1?"Muy suave":v<=3?"Suave":v<=6?"Moderado":v<9?"Duro":v<10?"Muy duro":"Esfuerzo máximo";
const opts=(arr,sel,lab)=>'<option value="">–</option>'+arr.map(v=>`<option value="${v}"${String(v)===String(sel)?" selected":""}>${v}${lab?" · "+lab(v):""}</option>`).join("");
const norm=k=>String(k).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const avg=a=>a.length?(a.reduce((s,v)=>s+v,0)/a.length).toFixed(1):"–";

const ANAM=[
 ["Datos","fecha_nac","Fecha de nacimiento","date"],
 ["Datos","telefono","Teléfono","text"],
 ["Datos","profesion","Profesión","text"],
 ["Objetivos","objetivo","Objetivo principal","text"],

/* ============ BASE: SHELL Y SESIÓN ============ */

    const adm=await db("GET",U,"?rol=eq.admin&select=id");

function renderSetup(){
  app.innerHTML=`<div class="fondo"></div><section class="card login"><img class="big" src="logo-alex.png" onerror="this.remove()"><h1>Primer uso</h1><p class="sub">Crea la cuenta de entrenador</p>
  <label>Nombre</label><input id="sn">
  <label>Contraseña (mín. 8)</label><input id="sp" type="password">

  <button class="gold" onclick="setup()">Crear entrenador</button></section>`;
}
async function setup(){
  const n=$("#sn").value.trim(), p=$("#sp").value, r=$("#sr").value.trim().toUpperCase();
  if(!n||p.length<8||!r) return alert("Rellena todos los campos (contraseña mín. 8)");

  alert("Cuenta creada. Código de acceso: ADMIN");

}

function renderLogin(msg=""){
  app.innerHTML=`<div class="fondo"></div><section class="card login"><img class="big" src="logo-alex.png" onerror="this.remove()"><h1>ALEX TRAINING LAB</h1><p class="sub">Tu Entrenador Personal</p>
  <label>Código de acceso</label><input id="lc" autocomplete="off">
  <label>Contraseña</label><input id="lp" type="password" onkeydown="if(event.key==='Enter')login()">
  <button class="gold" onclick="login()">Entrar</button>
  <p class="err">${esc(msg)}</p>
  <p><a href="#" onclick="event.preventDefault();renderRecover()">He olvidado mi contraseña</a></p></section>`;
}
async function login(){
  const c=$("#lc").value.trim().toUpperCase(), p=$("#lp").value;
  if(!c||!p) return renderLogin("Introduce código y contraseña");
  try{
    const [u]=await db("GET",U,`?codigo=eq.${encodeURIComponent(c)}&select=*`);
    if(!u||u.pass_hash!==await sha(p)) return renderLogin("Código o contraseña incorrectos");
    ME=u;
    if(u.rol==="admin") adminLista(); else panelCliente();
  }catch(e){ renderLogin("Error de conexión: "+e.message) }
}

function renderRecover(msg=""){
  app.innerHTML=`<div class="fondo"></div><section class="card login"><h1>Recuperar acceso</h1>
  <label>Código de acceso</label><input id="rc" autocomplete="off">
  <label>Código de recuperación</label><input id="rr" autocomplete="off">
  <label>Nueva contraseña (mín. 6)</label><input id="rp" type="password">
  <button class="gold" onclick="recuperar()">Restablecer</button>
  <p class="err">${esc(msg)}</p>
  <p><a href="#" onclick="event.preventDefault();renderLogin()">Volver</a></p></section>`;
}
async function recuperar(){
  const c=$("#rc").value.trim().toUpperCase(), r=$("#rr").value.trim().toUpperCase(), p=$("#rp").value;
  if(p.length<6) return renderRecover("La contraseña debe tener mínimo 6 caracteres");
  try{
    const [u]=await db("GET",U,`?codigo=eq.${encodeURIComponent(c)}&select=id,recovery_hash`);
    if(!u||u.recovery_hash!==await sha(r)) return renderRecover("Datos de recuperación incorrectos");
    await db("PATCH",U,`?id=eq.${u.id}`,{pass_hash:await sha(p)});
    renderLogin("Contraseña restablecida. Entra con la nueva.");
  }catch(e){ renderRecover("Error: "+e.message) }
}

function confirmar(msg){
  return new Promise(res=>{
    const m=document.createElement("div");
    m.className="modal";
    m.innerHTML=`<div class="card"><p>${esc(msg)}</p><div class="row"><button class="ghost" id="cn">Cancelar</button><button class="danger" id="ok">Borrar</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector("#cn").onclick=()=>{m.remove();res(false)};
    m.querySelector("#ok").onclick=()=>{m.remove();res(true)};
  });
}

/* ============ ENTRENADOR ============ */
async function adminLista(){
  const clis=await db("GET",U,"?rol=eq.cliente&select=id,nombre,codigo&order=nombre.asc");
  shell(`<nav class="tabs"><button class="on">Clientes</button><button onclick="adminNuevo()">+ Nuevo cliente</button></nav>

}

function adminNuevo(msg=""){
  shell(`<nav class="tabs"><button onclick="adminLista()">Clientes</button><button class="on">+ Nuevo cliente</button></nav>
  <div class="card"><label>Nombre</label><input id="nn">
  <label>Contraseña temporal (el cliente la cambiará)</label><input id="np" value="${rnd(8)}">
  <label>Código de recuperación</label><input id="nr" value="${rnd(8)}">
  <button class="gold" onclick="crearCliente()">Crear cliente</button>
  <p class="ok">${esc(msg)}</p></div>`);
}
async function crearCliente(){
  const nombre=$("#nn").value.trim(), pw=$("#np").value, rc=$("#nr").value.trim().toUpperCase();
  if(!nombre||pw.length<6) return alert("Nombre y contraseña (mín. 6 caracteres) obligatorios");
  let codigo;
  do{ codigo=rnd(5) }while((await db("GET",U,`?codigo=eq.${codigo}&select=id`)).length);
  await db("POST",U,"",{codigo,nombre,rol:"cliente",pass_hash:await sha(pw),recovery_hash:await sha(rc),anamnesis:null});
  adminNuevo(`Creado. Código: ${codigo} · Contraseña temporal: ${pw} · Recuperación: ${rc}. Apúntalos: no volverán a mostrarse.`);
}

async function adminFicha(id){
  const [c]=await db("GET",U,`?id=eq.${id}&select=id,codigo,nombre,anamnesis`);
  FICHA=c; adminTab("ent");
}
async function adminTab(t){
  const c=FICHA; let body="";
  const tabs=[["ent","Entrenamientos"],["ana","Anamnesis"],["del","Eliminar"]]
    .map(([k,l])=>`<button class="${t===k?"on":""}" onclick="adminTab('${k}')">${l}</button>`).join("");
  if(t==="ent"){
    const ents=await db("GET",E,`?cliente_codigo=eq.${c.codigo}&select=*&order=fecha.desc`);
    body=`<div class="card"><h3>Subir hoja de Excel</h3>
      <p class="hint">Columnas: Fecha · Bloque · Ejercicio · Series · Reps · RPE objetivo · Descanso · Notas</p>
      <input type="file" accept=".xlsx,.xls,.csv" onchange="importar(this.files[0])"></div>
      ${stats(ents)}${ents.map(e=>sesion(e,false)).join("")||"<p class='hint'>Sin entrenamientos cargados.</p>"}`;
  } else if(t==="ana"){
    body=anamView(c.anamnesis);
  } else {
    body=`<div class="card"><p class="hint">Borra al cliente con todos sus entrenamientos y su anamnesis.</p>
      <button class="danger" onclick="eliminarCliente('${c.id}','${c.codigo}')">Eliminar cliente</button></div>`;
  }
  shell(`<button class="ghost" onclick="adminLista()">← Clientes</button>
    <h2>${esc(c.nombre)} <small class="hint">${esc(c.codigo)}</small></h2>
    <div class="tabs">${tabs}</div>${body}`);
}

const fechaLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function fmtF(v){
  if(v instanceof Date) return fechaLocal(v);
  if(typeof v==="number") return XLSX.SSF.format("yyyy-mm-dd",v);
  return String(v||"").trim()||"Sin fecha";
}
/* ---- Lector de la plantilla de coach: bloques con Día 1 y Día 2 en paralelo ---- */
const celdaTxt=(ws,a)=>{const c=ws[a];if(!c||c.t==="b"||c.v==null||c.v==="")return "";return String(c.w!=null?c.w:c.v).trim()};
const celdaRaw=(ws,a)=>{const c=ws[a];return c?c.v:null};
const LADO=[
 {warm:"B",wser:"C",wrep:"D",wint:"E",code:"F",ej:"G",ser:"H",rep:"I",int:"J",rpe:"K",rir:"L",prog:"M",dia:"J",micro:"F"},
 {warm:"P",wser:"Q",wrep:"R",wint:"S",code:"T",ej:"U",ser:"V",rep:"W",int:"X",rpe:"Y",rir:"Z",prog:"AA",dia:"X",micro:"T"}
];
function leerPlantilla(ws){
  const max=XLSX.utils.decode_range(ws["!ref"]).e.r+1;
  const inicios=[];
  for(let r=1;r<=max;r++) if(celdaTxt(ws,"D"+r).toUpperCase().startsWith("NOMBRE")) inicios.push(r);
  const sesiones=[];
  inicios.forEach((r0,i)=>{
    const fin=(inicios[i+1]??max+1)-1;
    LADO.forEach(L=>{
      const bloques=new Map();
      const ensure=nombre=>{ if(!bloques.has(nombre)) bloques.set(nombre,{nombre,ejercicios:[]}); return bloques.get(nombre) };
      const add=(nombre,ex)=>ensure(nombre).ejercicios.push(ex);
      let warmActual="Calentamiento";
      for(let r=r0+9;r<=fin;r++){
        const wn=celdaTxt(ws,L.warm+r);
        if(wn){
          if(!celdaTxt(ws,L.wser+r)&&!celdaTxt(ws,L.wrep+r)){ warmActual="Calentamiento · "+wn; ensure(warmActual); }
          else add(warmActual,{codigo:"",ejercicio:wn,series:celdaTxt(ws,L.wser+r),reps:celdaTxt(ws,L.wrep+r),intensidad:celdaTxt(ws,L.wint+r),rpe_objetivo:"",rir_objetivo:"",progresion:""});
        }
        const code=celdaTxt(ws,L.code+r), ej=celdaTxt(ws,L.ej+r);
        if(code&&ej){
          const letra=code.replace(/[^A-Za-z]/g,"").charAt(0).toUpperCase()||"·";
          add("Parte principal · "+letra,{codigo:code.replace(/\.$/,""),ejercicio:ej,series:celdaTxt(ws,L.ser+r),reps:celdaTxt(ws,L.rep+r),intensidad:celdaTxt(ws,L.int+r),rpe_objetivo:celdaTxt(ws,L.rpe+r),rir_objetivo:celdaTxt(ws,L.rir+r),progresion:celdaTxt(ws,L.prog+r)});
        }
      }
      if(!bloques.size) return;
      const fv=celdaRaw(ws,L.dia+(r0+2));
      const fecha=fv instanceof Date?fechaLocal(fv):(celdaTxt(ws,L.dia+(r0+2))||"Sin fecha");
      const dia=celdaTxt(ws,L.dia+(r0+1))||"Entrenamiento";
      const micro=celdaTxt(ws,L.micro+(r0+6));
      const todos=[...bloques.values()];
      const orden=[...todos.filter(b=>b.nombre.startsWith("Calentamiento")),...todos.filter(b=>!b.nombre.startsWith("Calentamiento"))];
      sesiones.push({fecha,titulo:dia+(micro?" · Microciclo "+micro:""),bloques:orden});
    });
  });
  return sesiones;
}
async function importar(file){
  if(!file) return;
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const sesiones=ws["!ref"]?leerPlantilla(ws):[];
    if(!sesiones.length) return importarPlano(file);
    const lote=sesiones.map(s=>({cliente_codigo:FICHA.codigo,fecha:s.fecha,titulo:s.titulo,bloques:s.bloques,registro:null}));
    const fechas=[...new Set(lote.map(s=>s.fecha))];
    const lista=`(${fechas.map(f=>encodeURIComponent(f)).join(",")})`;
    const previas=await db("GET",E,`?cliente_codigo=eq.${FICHA.codigo}&fecha=in.${lista}&select=id,registro`);
    if(previas.length){
      const conReg=previas.filter(p=>p.registro).length;
      if(!(await confirmar(`Ya hay ${previas.length} entrenamiento(s) con esas fechas${conReg?` (${conReg} con registros del cliente)`:""}. Se sustituirán por los nuevos.`))) return;
      await db("DELETE",E,`?cliente_codigo=eq.${FICHA.codigo}&fecha=in.${lista}`);
    }
    await db("POST",E,"",lote);
    alert(`Importadas ${lote.length} sesiones`);
    adminTab("ent");
  }catch(e){ alert("Error al importar: "+e.message) }
}
async function importarPlano(file){
  if(!file) return;
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""})
      .map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[norm(k),v])));
    const ses={};
    rows.forEach(r=>{
      const ej=String(r.ejercicio||"").trim(); if(!ej) return;
      const f=fmtF(r.fecha), bl=String(r.bloque||"General").trim()||"General";
      ses[f]??={}; ses[f][bl]??=[];
      ses[f][bl].push({ejercicio:ej,series:r.series??"",reps:r.reps??"",rpe_objetivo:r["rpe objetivo"]??r.rpe??"",descanso:r.descanso??"",notas:r.notas??""});
    });
    const lote=Object.entries(ses).map(([fecha,bl])=>({
      cliente_codigo:FICHA.codigo, fecha, titulo:"Entrenamiento "+fecha,
      bloques:Object.entries(bl).map(([nombre,ejercicios])=>({nombre,ejercicios})), registro:null
    }));
    if(!lote.length) return alert("No encuentro filas válidas (necesito la columna Ejercicio)");
    await db("POST",E,"",lote);
    alert(`Importadas ${lote.length} sesiones`);
    adminTab("ent");
  }catch(e){ alert("Error al importar: "+e.message) }
}

async function eliminarCliente(id,codigo){
  if(!(await confirmar("Se borrarán el cliente, sus entrenamientos y su anamnesis. No se puede deshacer."))) return;
  await db("DELETE",E,`?cliente_codigo=eq.${codigo}`);
  await db("DELETE",U,`?id=eq.${id}`);
  adminLista();
}

function stats(ents){
  const rows=[];
  ents.forEach(e=>(e.registro?.bloques||[]).forEach(b=>(b?.ejercicios||[]).forEach(x=>x&&rows.push(x))));
  const rpe=rows.map(x=>num(x.rpe)).filter(v=>v!==null);
  const rir=rows.map(x=>num(x.rir)).filter(v=>v!==null);
  const reps=rows.map(x=>num(x.reps)).filter(v=>v!==null);
  const reg=ents.filter(e=>e.registro).length;
  const porSesion=ents.filter(e=>e.registro).map(e=>{
    const xs=[]; (e.registro.bloques||[]).forEach(b=>(b?.ejercicios||[]).forEach(x=>x&&xs.push(x)));
    const rp=xs.map(x=>num(x.rpe)).filter(v=>v!==null);
    const a=rp.length?rp.reduce((s,v)=>s+v,0)/rp.length:0;
    return `<div class="bar"><span>${esc(e.fecha)}</span><div><i style="width:${Math.min(a*10,100)}%"></i></div><b>${a?a.toFixed(1):"–"}</b></div>`;
  }).join("");
  return `<div class="card"><h3>Estadísticas</h3>
    <div class="stats">
      <div>Sesiones registradas<b>${reg}/${ents.length}</b></div>
      <div>RPE medio<b>${avg(rpe)}</b></div>
      <div>RIR medio<b>${avg(rir)}</b></div>
      <div>Reps totales<b>${reps.reduce((s,v)=>s+v,0)}</b></div>
    </div>
    <h4>RPE medio por sesión</h4>${porSesion||"<p class='hint'>Sin registros todavía.</p>"}</div>`;
}

/* ============ CLIENTE ============ */
async function panelCliente(){
  CE=await db("GET",E,`?cliente_codigo=eq.${ME.codigo}&select=*&order=fecha.desc`);
  shell(`<nav class="tabs"><button onclick="cliTab('ent')">Entrenamientos</button><button onclick="cliTab('ana')">Anamnesis</button><button onclick="cliTab('pw')">Cambiar contraseña</button></nav><div id="b"></div>`);
  cliTab(ME.anamnesis?"ent":"ana");
}
function cliTab(t){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.getAttribute("onclick")===`cliTab('${t}')`));
  const b=$("#b");
  if(t==="ent") b.innerHTML=CE.length?CE.map(e=>sesion(e,true)).join(""):"<p class='hint'>Todavía no tienes entrenamientos cargados.</p>";
  if(t==="ana") b.innerHTML=(!ME.anamnesis?"<p class='err'>Completa tu anamnesis para que tu entrenador te conozca.</p>":"")+anamForm(ME.anamnesis||{});
  if(t==="pw") b.innerHTML=`<div class="card"><h3>Cambiar contraseña</h3><input id="pw1" type="password" placeholder="Nueva contraseña (mín. 6)"><button class="gold" onclick="cambiarPw()">Guardar</button></div>`;
}
async function cambiarPw(){
  const p=$("#pw1").value;
  if(p.length<6) return alert("Mínimo 6 caracteres");
  await db("PATCH",U,`?id=eq.${ME.id}`,{pass_hash:await sha(p)});
  alert("Contraseña cambiada");
}

/* Sesión de entrenamiento: cliente registra, entrenador consulta (solo lectura) */
function sesion(e,editable){
  const reg=e.registro||{};
  const dis=editable?"":"disabled";
  return `<div class="card ses" data-id="${e.id}"><h3>${esc(e.titulo)}<small>${esc(e.fecha)}</small></h3>
  ${(e.bloques||[]).map((b,bi)=>`<h4>${esc(b.nombre)}</h4>
    <table><thead><tr><th>Ejercicio</th><th>Series</th><th>Reps obj.</th><th>Intensidad</th><th>RPE obj.</th><th>Reps</th><th>RPE</th><th>RIR</th><th>Comentario</th></tr></thead><tbody>
    ${b.ejercicios.map((x,xi)=>{
      const r=reg.bloques?.[bi]?.ejercicios?.[xi]||{};
      return `<tr data-b="${bi}" data-x="${xi}">
        <td>${x.codigo?`<small class="hint">${esc(x.codigo)}</small> `:""}${esc(x.ejercicio)}</td><td>${esc(x.series)}</td><td>${esc(x.reps)}</td><td>${esc(x.intensidad)}</td><td>${esc(x.rpe_objetivo)}</td>
        <td><input class="reps" ${dis} value="${esc(r.reps??"")}" style="width:70px"></td>
        <td><select class="rpe" ${dis}>${opts(RPE,r.rpe,rpeLab)}</select></td>
        <td><select class="rir" ${dis}>${opts(RIR,r.rir)}</select></td>
        <td><input class="com" ${dis} value="${esc(r.comentario??"")}"></td></tr>`;
    }).join("")}
    </tbody></table>
    <label>Comentario del bloque</label>
    <textarea class="bc" data-bi="${bi}" ${dis}>${esc(reg.bloques?.[bi]?.comentario??"")}</textarea>`).join("")}
  ${editable?`<button class="gold" onclick="guardarReg('${e.id}',this)">Guardar registro</button>`:""}
  </div>`;
}
async function guardarReg(id,btn){
  const card=document.querySelector(`.ses[data-id="${id}"]`);
  const bloques=[];
  card.querySelectorAll("tr[data-b]").forEach(tr=>{
    const bi=+tr.dataset.b, xi=+tr.dataset.x;
    bloques[bi]??={ejercicios:[],comentario:""};
    bloques[bi].ejercicios[xi]={
      reps:tr.querySelector(".reps").value.trim(),
      rpe:tr.querySelector(".rpe").value,
      rir:tr.querySelector(".rir").value,
      comentario:tr.querySelector(".com").value.trim()
    };
  });
  card.querySelectorAll("textarea.bc").forEach(t=>{
    const bi=+t.dataset.bi;
    bloques[bi]??={ejercicios:[],comentario:""};
    bloques[bi].comentario=t.value.trim();
  });
  try{
    await db("PATCH",E,`?id=eq.${id}`,{registro:{bloques}});
    btn.textContent="Guardado ✔";
  }catch(e){ alert("Error al guardar: "+e.message) }
}

/* ============ ANAMNESIS ============ */
function anamForm(v){
  let html="", grp="";
  ANAM.forEach(([g,k,label,type])=>{
    if(g!==grp){ if(grp) html+="</fieldset>"; html+=`<fieldset><legend>${g}</legend>`; grp=g; }
    const val=v[k]??"";
    if(type==="textarea") html+=`<label>${label}</label><textarea id="an_${k}">${esc(val)}</textarea>`;
    else if(type==="check") html+=`<label class="chk"><input type="checkbox" id="an_${k}" ${val?"checked":""}> ${label}</label>`;
    else html+=`<label>${label}</label><input id="an_${k}" type="${type}" value="${esc(val)}">`;
  });
  html+="</fieldset>";
  return `<div class="card"><h3>Anamnesis</h3>${html}<button class="gold" onclick="guardarAnam()">Guardar anamnesis</button></div>`;
}
async function guardarAnam(){
  const o={};
  ANAM.forEach(([g,k,l,t])=>{ const el=$("#an_"+k); o[k]=t==="check"?el.checked:el.value.trim(); });
  if(!o.consent) return alert("Debes aceptar el consentimiento para guardar");
  try{
    await db("PATCH",U,`?id=eq.${ME.id}`,{anamnesis:o});
    ME.anamnesis=o;
    alert("Anamnesis guardada");
  }catch(e){ alert("Error: "+e.message) }
}
function anamView(a){
  if(!a) return `<div class="card"><p class="hint">Este cliente aún no ha completado la anamnesis.</p></div>`;
  let html="", grp="";
  ANAM.forEach(([g,k,l])=>{
    if(g!==grp){ if(grp) html+="</dl>"; html+=`<h4>${g}</h4><dl class="dl">`; grp=g; }
    html+=`<dt>${l}</dt><dd>${a[k]===true?"Sí":esc(a[k]||"–")}</dd>`;
  });
  return `<div class="card">${html}</dl></div>`;
}

start();
</script>
