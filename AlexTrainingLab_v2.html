<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEX TRAINING LAB</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #d4af37;
            --dark: #1a1a1a;
            --darker: #0f0f0f;
            --gray: #808080;
            --light-gray: #d3d3d3;
            --white: #ffffff;
            --success: #4caf50;
            --error: #f44336;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 100%);
            color: var(--light-gray);
            min-height: 100vh;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: rgba(45, 45, 45, 0.98);
            border-radius: 15px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            border: 1px solid #404040;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-login {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .banner-login {
            width: 100%;
            height: 80px;
            margin: 20px 0;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .login-header h1 {
            color: var(--primary);
            font-size: 1.5em;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: var(--gray);
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #404040;
            background: rgba(60, 60, 60, 0.8);
            color: var(--light-gray);
            border-radius: 8px;
            font-size: 1em;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, #c9a227 100%);
            color: var(--dark);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4);
        }

        .login-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #404040;
        }

        .login-tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-weight: bold;
            border-bottom: 3px solid transparent;
        }

        .login-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.2);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--error);
        }

        .success-message {
            background: rgba(76, 175, 80, 0.2);
            color: #66bb6a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--success);
        }

        .app-container {
            display: none;
            min-height: 100vh;
        }

        .app-container.active {
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(45, 45, 45, 0.98);
            border-bottom: 3px solid var(--primary);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            width: 60px;
            height: 60px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .header-title h1 {
            color: var(--primary);
            font-size: 1.3em;
            margin: 0;
        }

        .header-title p {
            color: var(--gray);
            font-size: 0.75em;
            margin: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info p {
            margin: 0;
            color: var(--light-gray);
            font-size: 0.9em;
        }

        .user-info .rol {
            color: var(--primary);
            font-weight: bold;
        }

        .btn-logout {
            background: var(--error);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-logout:hover {
            background: #d32f2f;
        }

        .sidebar {
            width: 250px;
            background: rgba(30, 30, 30, 0.98);
            border-right: 1px solid #404040;
            padding-top: 30px;
        }

        .nav-item {
            padding: 15px 25px;
            color: var(--gray);
            cursor: pointer;
            border-left: 4px solid transparent;
            text-transform: uppercase;
            font-size: 0.9em;
            font-weight: bold;
            display: flex;
            gap: 10px;
        }

        .nav-item:hover {
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary);
            border-left-color: var(--primary);
        }

        .nav-item.active {
            background: rgba(212, 175, 55, 0.2);
            color: var(--primary);
            border-left-color: var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .section-title {
            color: var(--primary);
            font-size: 2em;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
        }

        .card {
            background: rgba(45, 45, 45, 0.8);
            border: 1px solid #404040;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.2);
        }

        .card-title {
            color: var(--primary);
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .card-content {
            color: var(--light-gray);
            line-height: 1.6;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .splash-content {
            text-align: center;
        }

        .splash-logo {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .splash-title {
            color: var(--primary);
            font-size: 2.5em;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <!-- SPLASH -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo" id="splashLogo"></div>
            <div class="splash-title">ALEX TRAINING LAB</div>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- LOGIN -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <div class="login-header">
                <div class="logo-login" id="loginLogo"></div>
                <div class="banner-login" id="loginBanner"></div>
                <h1>ALEX TRAINING LAB</h1>
                <p>Tu Entrenador Personal</p>
            </div>

            <div id="loginMessage"></div>

            <div class="login-tabs">
                <button class="login-tab active" data-tab="login">Acceder</button>
                <button class="login-tab" data-tab="register">Registrarse</button>
            </div>

            <div class="tab-content active" data-tab-content="login">
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="admin@alextraininglab.com" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="loginPassword" placeholder="admin123" required>
                    </div>
                    <button type="submit" class="btn">Acceder</button>
                </form>
            </div>

            <div class="tab-content" data-tab-content="register">
                <form id="registerForm">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="registerName" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="registerPassword" required>
                    </div>
                    <button type="submit" class="btn">Registrarse</button>
                </form>
            </div>
        </div>
    </div>

    <!-- APP -->
    <div class="app-container" id="appContainer">
        <div class="header">
            <div class="header-left">
                <div class="header-logo" id="headerLogo"></div>
                <div class="header-title">
                    <h1>ALEX TRAINING LAB</h1>
                    <p>Sistema Profesional</p>
                </div>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <p id="userName">Usuario</p>
                    <p class="rol" id="userRol">ROL</p>
                </div>
                <button class="btn-logout" id="logoutBtn">Cerrar Sesión</button>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar" id="sidebar"></div>
            <div class="content-area" id="contentArea">
                <div class="content-section active" data-section="dashboard">
                    <div class="section-title">📊 Dashboard</div>
                    <div class="grid" id="dashboardGrid">
                        <div class="loading"><div class="spinner"></div><p>Cargando...</p></div>
                    </div>
                </div>
                <div class="content-section" data-section="clientes">
                    <div class="section-title">👥 Clientes</div>
                    <div><p>Gestión de clientes</p></div>
                </div>
                <div class="content-section" data-section="entrenamientos">
                    <div class="section-title">💪 Entrenamientos</div>
                    <div><p>Entrenamientos</p></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zxarhydagapzgozrxaee.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_pcdggueDF2w9LVHDhvRpWg_NhLd1jb9';
        
        // Crear cliente Supabase
        const { createClient } = window.supabase;
        const sbClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;

        function cargarImagenes() {
            document.getElementById('splashLogo').style.backgroundImage = "url('logo-leon.png')";
            document.getElementById('loginLogo').style.backgroundImage = "url('logo-leon.png')";
            document.getElementById('loginBanner').style.backgroundImage = "url('banner-alex.png')";
            document.getElementById('headerLogo').style.backgroundImage = "url('logo-leon.png')";
        }

        function mostrarLogin() {
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('appContainer').classList.remove('active');
        }

        function mostrarApp() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');
        }

        function switchTab(tab) {
            document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');
            document.querySelector(`[data-tab-content="${tab}"]`)?.classList.add('active');
        }

        function mostrarMensaje(texto, tipo) {
            const div = document.getElementById('loginMessage');
            if (div) {
                div.innerHTML = `<div class="${tipo}-message">${texto}</div>`;
                setTimeout(() => { div.innerHTML = ''; }, 5000);
            }
        }

        async function manejarLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
                if (error) throw error;

                const { data: usuario } = await sbClient.from('usuarios').select('*').eq('email', email).single();
                currentUser = usuario;

                document.getElementById('userName').textContent = usuario.nombre;
                document.getElementById('userRol').textContent = usuario.rol.toUpperCase();

                mostrarApp();
                cargarDashboard();
            } catch (error) {
                mostrarMensaje('Error: ' + error.message, 'error');
            }
        }

        async function cargarDashboard() {
            const container = document.getElementById('dashboardGrid');
            container.innerHTML = `
                <div class="card">
                    <div class="card-title">Bienvenido</div>
                    <div class="card-content">
                        <p>Hola ${currentUser?.nombre || 'Usuario'}!</p>
                        <p>Bienvenido a ALEX TRAINING LAB</p>
                        <p>Tu aplicación profesional de entrenamiento personal.</p>
                    </div>
                </div>
            `;
        }

        async function cerrarSesion() {
            await sbClient.auth.signOut();
            currentUser = null;
            mostrarLogin();
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarImagenes();
            document.getElementById('splashScreen').style.display = 'none';
            mostrarLogin();

            // Event listeners
            document.querySelectorAll('.login-tab').forEach(tab => {
                tab.addEventListener('click', (e) => switchTab(e.target.dataset.tab));
            });

            document.getElementById('loginForm')?.addEventListener('submit', manejarLogin);
            document.getElementById('logoutBtn')?.addEventListener('click', cerrarSesion);

            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    item.classList.add('active');
                    const seccion = item.dataset.section;
                    document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
                    document.querySelector(`[data-section="${seccion}"]`)?.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
